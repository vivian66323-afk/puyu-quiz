<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>房子的一生｜菩語國際設計</title>
<meta name="description" content="你出生成一間房子，活過八十年——住戶來了又走、孩子長大又離家、你老了又被重新愛過。一個關於空間、記憶與好好對待的小遊戲。菩語國際設計。">
<meta name="robots" content="noindex">
<meta property="og:title" content="房子的一生｜菩語國際設計">
<meta property="og:description" content="你是一間房子。活過八十年，看看你會被拆掉，還是被好好愛著。">
<meta name="theme-color" content="#15110e">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15110e; --bg2:#1f1915; --ink:#f4efe8; --sub:#b7ab9c;
    --gold:#c9a86a; --gold-soft:#e3cfa3; --line:#3a3027;
    --health:#8fb3a6; --happy:#e0a86a; --func:#9aa7c7; --bond:#d98c8c;
    --card:#211a15;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Noto Sans TC",sans-serif; background:var(--bg); color:var(--ink);
    min-height:100dvh; line-height:1.7; overflow-x:hidden;
  }
  .serif{font-family:"Noto Serif TC",serif;}
  .wrap{max-width:560px; margin:0 auto; padding:22px 20px 40px; min-height:100dvh; display:flex; flex-direction:column;}
  .screen{display:none; animation:fade .5s ease both;}
  .screen.on{display:flex; flex-direction:column; flex:1;}
  @keyframes fade{from{opacity:0; transform:translateY(8px);}to{opacity:1; transform:none;}}

  /* intro */
  .intro{justify-content:center; text-align:center; gap:4px;}
  .kicker{color:var(--gold); letter-spacing:.35em; font-size:12px; font-weight:700;}
  .title{font-size:40px; font-weight:700; margin:10px 0 4px; letter-spacing:.04em;}
  .lead{color:var(--sub); font-size:16px; max-width:30em; margin:8px auto 0;}
  .rule{width:46px; height:1px; background:var(--gold); margin:24px auto; opacity:.6;}
  .btn{
    font-family:inherit; cursor:pointer; border:none; border-radius:999px;
    background:linear-gradient(180deg,#d8b878,#b7924f); color:#231a10; font-weight:700;
    font-size:17px; padding:15px 34px; letter-spacing:.08em; transition:transform .15s, filter .15s;
    box-shadow:0 6px 20px rgba(0,0,0,.4);
  }
  .btn:active{transform:translateY(1px) scale(.99);}
  .btn.ghost{background:transparent; color:var(--gold); border:1px solid var(--line); box-shadow:none; font-weight:500;}
  .btn.block{width:100%;}
  .btns{display:flex; flex-direction:column; gap:12px; margin-top:26px;}

  /* play header */
  .id{text-align:center; margin-bottom:4px;}
  .id .name{font-size:21px; font-weight:600; letter-spacing:.03em;}
  .id .meta{color:var(--sub); font-size:12.5px; letter-spacing:.1em; margin-top:2px;}
  .id .resident{color:var(--gold-soft); font-size:12.5px; letter-spacing:.06em; margin-top:5px; min-height:1.2em;}

  /* house */
  .house{display:flex; justify-content:center; margin:8px 0 4px;}
  .house svg{width:188px; height:auto; display:block; filter:drop-shadow(0 12px 26px rgba(0,0,0,.5));}
  .win{transition:fill 1s ease, opacity 1s ease;}
  #crack,#tree,#sun,#reno,#tape,#sign{transition:opacity 1.1s ease;}
  #wall,#roof{transition:fill 1.2s ease;}

  .agebar{display:flex; align-items:baseline; justify-content:center; gap:9px; margin:2px 0 12px;}
  .agebar .yr{font-size:30px; font-weight:700; color:var(--gold-soft);}
  .agebar .lab{color:var(--sub); font-size:12.5px; letter-spacing:.2em;}
  .agebar .cal{color:var(--sub); font-size:11px; letter-spacing:.12em; opacity:.7;}

  .stats{display:flex; flex-direction:column; gap:9px; margin:2px 0 12px;}
  .stat{display:flex; align-items:center; gap:10px; font-size:12.5px;}
  .stat .nm{width:62px; color:var(--sub); flex:none; letter-spacing:.06em;}
  .track{flex:1; height:7px; background:#0e0b09; border-radius:99px; overflow:hidden; border:1px solid #2a221b;}
  .fill{height:100%; width:50%; border-radius:99px; transition:width .9s cubic-bezier(.22,.9,.3,1);}
  .stat .vv{width:28px; text-align:right; color:var(--ink); font-variant-numeric:tabular-nums; flex:none;}

  .log{flex:1; min-height:96px; display:flex; flex-direction:column; gap:9px; margin:4px 0 8px; overflow:hidden;}
  .entry{background:var(--bg2); border:1px solid var(--line); border-radius:14px; padding:11px 15px; font-size:14px; animation:fade .5s ease both;}
  .entry .ea{color:var(--gold); font-size:11px; letter-spacing:.12em; font-weight:700; display:block; margin-bottom:3px;}
  .entry .delta{color:var(--sub); font-size:11.5px; margin-top:5px;}
  .controls{display:flex; justify-content:center; gap:14px; align-items:center; margin-top:2px;}

  /* reflection / choice modal */
  .modal{position:fixed; inset:0; background:rgba(8,6,4,.8); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; padding:22px; z-index:40;}
  .modal.on{display:flex; animation:fade .4s ease both;}
  .sheet{background:linear-gradient(180deg,#241d17,#1b1511); border:1px solid var(--line); border-radius:22px; padding:26px 22px; max-width:440px; width:100%; text-align:center; max-height:90dvh; overflow-y:auto;}
  .sheet .age{color:var(--gold); letter-spacing:.3em; font-size:12px; font-weight:700;}
  .sheet h3{font-family:"Noto Serif TC",serif; font-size:20px; font-weight:600; margin:10px 0 8px; line-height:1.55;}
  .sheet p{color:var(--sub); font-size:14.5px; margin:0 0 6px;}
  .choices{display:flex; flex-direction:column; gap:10px; margin-top:18px;}
  .choice{font-family:inherit; cursor:pointer; text-align:left; background:#15110e; border:1px solid var(--line); color:var(--ink); border-radius:14px; padding:13px 16px; font-size:15px; transition:border-color .15s, background .15s;}
  .choice:hover{border-color:var(--gold);}
  .choice:active{background:#2a2219;}
  .choice b{color:var(--gold-soft); font-weight:600;}
  .choice small{display:block; color:var(--sub); font-size:12.5px; margin-top:3px; line-height:1.55;}

  /* ending */
  .end{justify-content:flex-start;}
  .resultcard{background:linear-gradient(170deg,#241d16,#17120e); border:1px solid #4a3c29; border-radius:22px; padding:26px 22px; text-align:center; position:relative; overflow:hidden;}
  .resultcard:before{content:""; position:absolute; inset:0; background:radial-gradient(120% 60% at 50% 0%, rgba(201,168,106,.14), transparent 70%); pointer-events:none;}
  .end-house{margin:2px 0 6px;}
  .end-house svg{width:150px;height:auto;filter:drop-shadow(0 10px 22px rgba(0,0,0,.5));}
  .verdict-k{color:var(--gold); letter-spacing:.3em; font-size:11px; font-weight:700;}
  .verdict{font-family:"Noto Serif TC",serif; font-size:29px; font-weight:700; margin:8px 0 2px; color:var(--gold-soft);}
  .epitaph{color:var(--ink); font-size:15px; margin:14px 2px 0; line-height:1.9;}
  .statline{display:flex; justify-content:center; flex-wrap:wrap; gap:6px 15px; margin:20px 0 4px; color:var(--sub); font-size:12.5px; letter-spacing:.05em;}
  .statline b{color:var(--ink); font-weight:600;}
  .philo{font-family:"Noto Serif TC",serif; color:var(--gold-soft); font-size:16px; margin-top:20px; padding-top:18px; border-top:1px solid var(--line); line-height:1.9;}
  .brand{color:var(--sub); font-size:11px; letter-spacing:.24em; margin-top:16px;}
  .cta{margin-top:24px;}
  .cta .lead{margin-bottom:14px; font-size:14px;}
  small.foot{display:block; text-align:center; color:#6b6052; font-size:11px; margin-top:24px; letter-spacing:.08em;}
  a{color:inherit;}
</style>
</head>
<body>
<div class="wrap">

  <!-- INTRO -->
  <section id="s-intro" class="screen on intro">
    <div class="kicker">PURELY ｜ 房子的一生</div>
    <h1 class="title serif">房子的一生</h1>
    <p class="lead">這一次，你不是住在房子裡的人。<br>你，就是那間房子。</p>
    <div class="house" aria-hidden="true">
      <!-- static intro house -->
      <svg viewBox="0 0 300 230" xmlns="http://www.w3.org/2000/svg">
        <polygon points="40,96 150,34 260,96" fill="#8a6b43"/>
        <rect x="58" y="96" width="184" height="120" fill="#c9b492"/>
        <rect x="132" y="162" width="36" height="54" fill="#7c5f3c"/>
        <rect x="78" y="116" width="34" height="30" fill="#ffd98a"/>
        <rect x="188" y="116" width="34" height="30" fill="#ffd98a"/>
        <line x1="40" y1="216" x2="260" y2="216" stroke="#5a4a36" stroke-width="3"/>
      </svg>
    </div>
    <p class="lead" style="font-size:14.5px">住戶會搬進來、生孩子、把身高畫在你的牆上，<br>孩子長大離家，老人在你懷裡慢慢變老。<br>你會漏水、會老、會被嫌棄——<br>也會在某一年，遇到一雙願意好好愛你的手。</p>
    <div class="btns">
      <button class="btn block" onclick="Game.start()">讓我出生 →</button>
    </div>
    <small class="foot">約 3 分鐘 ‧ 建議手機直向遊玩</small>
  </section>

  <!-- PLAY -->
  <section id="s-play" class="screen">
    <div class="id">
      <div class="name serif" id="p-name">—</div>
      <div class="meta" id="p-meta">—</div>
      <div class="resident" id="p-res">　</div>
    </div>
    <div class="house" aria-hidden="true" id="p-house"></div>
    <div class="agebar"><span class="yr serif" id="p-age">0</span><span class="lab">歲</span><span class="cal" id="p-cal"></span></div>
    <div class="stats" id="p-stats"></div>
    <div class="log" id="p-log"></div>
    <div class="controls">
      <button class="btn ghost" id="p-speed" onclick="Game.toggleSpeed()">▶ 一般</button>
    </div>
  </section>

  <!-- ENDING -->
  <section id="s-end" class="screen end">
    <div class="resultcard" id="end-card">
      <div class="end-house" id="end-house"></div>
      <div class="verdict-k" id="end-k">結局</div>
      <div class="verdict serif" id="end-verdict">—</div>
      <div class="epitaph" id="end-epitaph">—</div>
      <div class="statline" id="end-stats"></div>
      <div class="philo serif" id="end-philo">—</div>
      <div class="brand">菩語國際設計 ‧ PURELY DESIGN</div>
    </div>
    <div class="cta">
      <p class="lead">你的家，也正在它的某一年。<br>想好好對待它接下來的人生嗎？</p>
      <div class="btns">
        <a class="btn block" id="cta-book" href="https://www.purely2006.com/" target="_blank" rel="noopener">聊聊你家的可能 →</a>
        <a class="btn ghost block" href="https://vivian66323-afk.github.io/puyu-quiz/" target="_blank" rel="noopener">測測你家是哪種家</a>
        <button class="btn ghost block" id="btn-share" onclick="Game.share()">分享這間房子的一生</button>
        <button class="btn ghost block" onclick="location.reload()">再活一次</button>
      </div>
    </div>
    <small class="foot">房子的一生 ‧ 菩語國際設計出品</small>
  </section>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="sheet">
    <div class="age" id="m-age">—</div>
    <h3 class="serif" id="m-title">—</h3>
    <p id="m-body">—</p>
    <div class="choices" id="m-choices"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const wpick=arr=>{let t=arr.reduce((s,x)=>s+x.w,0),r=Math.random()*t;for(const x of arr){if((r-=x.w)<=0)return x;}return arr[arr.length-1];};
const clamp=n=>Math.max(0,Math.min(100,Math.round(n)));
const roll=p=>Math.random()<p;

const STAT_DEF=[
  {k:'health',nm:'結構健康',c:'var(--health)'},
  {k:'happy', nm:'居住幸福',c:'var(--happy)'},
  {k:'func',  nm:'空間機能',c:'var(--func)'},
  {k:'bond',  nm:'屋主情感',c:'var(--bond)'},
];

const TYPES=[
  {w:34,name:'五層公寓',tag:'無電梯 ‧ 步登公寓',s:{health:62,happy:58,func:52,bond:55}},
  {w:24,name:'電梯華廈',tag:'中坪數 ‧ 電梯',    s:{health:70,happy:60,func:64,bond:52}},
  {w:20,name:'電梯大樓',tag:'社區 ‧ 管理員',    s:{health:74,happy:56,func:68,bond:46}},
  {w:14,name:'連棟透天',tag:'三四層 ‧ 自己的門', s:{health:60,happy:64,func:60,bond:62}},
  {w:8, name:'獨棟透天',tag:'有庭院 ‧ 一家人的城堡',s:{health:66,happy:68,func:66,bond:70}},
];
const PLACES=[{w:30,n:'桃園'},{w:26,n:'新北'},{w:16,n:'台北'},{w:14,n:'台中'},{w:14,n:'其他縣市'}];
const SURNAMES=['林','陳','黃','張','李','王','吳','蔡','鄭','許','劉','周','葉','謝'];

// ---------- 住戶劇本：一戶人家的一生 ----------
// 每個 beat：{a:標籤, txt:文字, d:數值, res:住戶列文字(可選)}
function makeHousehold(firstEver, age){
  const sn = pick(SURNAMES);
  // 住戶型態
  const kinds = firstEver
    ? [{w:5,k:'newly'},{w:3,k:'family'},{w:2,k:'retire'}]
    : [{w:4,k:'newly'},{w:4,k:'family'},{w:3,k:'retire'},{w:3,k:'rent'},{w:2,k:'single'}];
  const kind = wpick(kinds).k;
  const label = {newly:'年輕夫妻',family:'一家四口',retire:'退休的老夫妻',rent:'租客',single:'一個人'}[kind];
  const hh={sn,kind,label,moveIn:age,beats:[],bi:0,gap:0,tenure:0};

  const B=hh.beats;
  if(kind==='newly'){
    B.push({a:sn+'家 ‧ 入住',txt:'一對剛結婚的'+sn+'先生'+sn+'太太搬了進來，油漆味還沒散。他們牽著手站在空房間裡說：這就是我們的家了。',d:{happy:9,bond:10},res:sn+'家 ‧ 新婚'});
    B.push({a:'第一個孩子',txt:'半夜的哭聲、客廳裡的學步車。你第一次被一個小小的人這樣全心全意地依賴著。',d:{bond:10,happy:6,func:-4},res:sn+'家 ‧ 有了孩子'});
    B.push({a:'牆上的鉛筆線',txt:'門框邊一道一道量身高的鉛筆線，愈畫愈高。這些線，後來成了你身上最珍貴的刺青。',d:{bond:8,happy:5},res:sn+'家 ‧ 孩子長大中'});
    B.push({a:'嫌你舊了',txt:'長大的孩子開始嫌你的房間小、嫌你的廚房舊。你沒說話——你知道，嫌棄也是一種太熟悉的親密。',d:{happy:-5},res:sn+'家 ‧ 青春期'});
    B.push({a:'孩子離家',txt:'行李箱拖出門的那天，房間一下子空了一半。'+sn+'太太站在門口看了很久，才把燈關上。',d:{bond:-4,happy:-6},res:sn+'家 ‧ 空巢'});
    B.push({a:'兩個人的晚年',txt:'又剩下兩個人了，像最初那樣。只是腳步慢了，話少了，電視的聲音大了。你把他們好好地收著。',d:{bond:6,happy:2},res:sn+'家 ‧ 相伴到老'});
  }else if(kind==='family'){
    B.push({a:sn+'家 ‧ 入住',txt:'一家子浩浩蕩蕩地搬了進來——大人、小孩、還有一隻狗。你瞬間被塞得滿滿的，熱鬧得不像話。',d:{happy:8,bond:8,func:-3},res:sn+'家 ‧ 一家四口'});
    B.push({a:'一桌年夜飯',txt:'除夕夜，你被每一盞燈、每一句笑、每一道菜的香氣填滿。這一刻你知道，自己不只是鋼筋水泥。',d:{happy:10,bond:8},res:sn+'家 ‧ 團圓'});
    B.push({a:'改一次格局',txt:'孩子大了，'+sn+'先生把一道牆打開，讓光和聲音流得更順。你覺得自己更懂他們要的生活了。',d:{func:9,happy:5,health:-3},res:sn+'家 ‧ 小改造'});
    B.push({a:'孩子們離家',txt:'一個去外地念書，一個結婚搬走。房門一扇扇關上，你學會了安靜。',d:{bond:-5,happy:-6},res:sn+'家 ‧ 空巢'});
  }else if(kind==='retire'){
    B.push({a:sn+'家 ‧ 入住',txt:'一對退休的'+sn+'夫妻搬了進來。他們說，走了大半輩子，只想要一個安安靜靜、曬得到太陽的家。',d:{happy:7,bond:7},res:sn+'家 ‧ 退休生活'});
    B.push({a:'陽台的花',txt:''+sn+'太太在陽台種滿了花，'+sn+'先生每天澆水。午後的光落在花上，也落在你身上。',d:{happy:8,health:2,bond:4},res:sn+'家 ‧ 侍花弄草'});
    B.push({a:'慢下來的日子',txt:'他們的腳步愈來愈慢。你把門檻、把光線、把每一個轉角，都盡量放得溫柔。',d:{bond:5},res:sn+'家 ‧ 相依'});
  }else if(kind==='rent'){
    B.push({a:sn+'房東 ‧ 隔間出租',txt:'你被隔成了好幾間套房。一道一道輕隔間切過你的身體，人們住一年就走，沒有人記得你的名字。',d:{bond:-12,func:-6,happy:-6},res:'出租中 ‧ 房客來來去去'});
    B.push({a:'來來去去',txt:'又一個房客退租了。鑰匙交回、押金退還，像什麼都沒發生過。你愈來愈像一個只是用來睡覺的地方。',d:{bond:-6,happy:-4},res:'出租中'});
  }else{ // single
    B.push({a:sn+'小姐 ‧ 入住',txt:'一個獨自生活的'+sn+'小姐搬了進來。她把你收拾得乾乾淨淨，週末煮一人份的飯，說這樣剛剛好。',d:{happy:6,bond:6,func:3},res:sn+'小姐 ‧ 一個人住'});
    B.push({a:'一隻貓',txt:'她養了一隻貓。貓在你的窗台上曬太陽、在你的沙發上磨爪。你多了一個不說話、卻一直都在的住戶。',d:{happy:6,bond:5,func:-2},res:sn+'小姐與貓'});
  }
  // 退場：住了這些年之後
  hh.exitAfter = Math.max(B.length*4, firstEver?22:16) + Math.floor(Math.random()*12);
  return hh;
}

// ---------- 建築事件（與住戶無關、隨屋齡與健康觸發） ----------
const BUILD=[
  {min:6, w:3, a:'屋頂的雨',txt:'一道水痕悄悄爬上天花板。沒人即時發現，直到壁癌在牆角開了花。',d:{health:-11,happy:-6},bones:true},
  {min:10,w:3, a:'管線老了',txt:'水管在牆裡悄悄鏽蝕，水壓一年比一年小。看不見的地方，總是最先老去。',d:{health:-9,func:-4},bones:true},
  {min:8, w:2, a:'樓上的腳步',txt:'樓上整修，電鑽打到了你的樑。你痛，但沒有人聽得見一間房子喊痛。',d:{health:-7}},
  {min:14,w:2, a:'颱風夜',txt:'風雨整夜拍打著你的窗。你把裡面的人護得好好的，自己卻滲進了幾處濕。',d:{health:-6,bond:4}},
  {min:18,w:2, a:'頂樓加蓋',txt:'屋頂多了一層鐵皮違建。你變重了、夏天更悶了，但也多擋了一點雨。',d:{health:-6,func:3,happy:-3}},
  {min:20,w:2, a:'仲介來拍照',txt:'有人在你門口拍照、談論你值多少錢，卻沒有人問你——住起來，到底好不好。',d:{happy:-4}},
];
const QUAKE={a:'大地震',txt:'天搖地動的那一夜，你用盡全身的鋼筋，死死撐住了裡面熟睡的人。牆裂了，吊燈碎了，但他們，都活著。',d:{health:-14,bond:9}};
const GOOD=[
  {min:4, w:3, a:'午後的光',txt:'陽光斜斜地走進來，落在木地板上，慢慢移動。住在你裡面的人停下腳步，深深吸了一口氣。',d:{happy:7,health:2}},
  {min:6, w:2, a:'鄰居串門',txt:'隔壁的阿姨端著一盤水餃按了門鈴。你的門常常為別人開著，這條巷子，住起來有人情味。',d:{happy:6,bond:4}},
  {min:8, w:2, a:'一場小宴',txt:'朋友來了，笑聲從客廳滿出來，一直鬧到深夜。你喜歡被這樣熱熱鬧鬧地住著。',d:{happy:6,bond:3}},
];

const Game={
  st:null, age:0, timer:null, speed:1, running:false, log:[],
  hh:null, emptySince:-99, cool:0, flags:null, info:null,
  fixedDone:new Set(),

  start(){
    const ty=wpick(TYPES), pl=wpick(PLACES);
    const birth=1960+Math.floor(Math.random()*47); // 1960–2006 落成
    this.st={...ty.s}; this.age=0; this.log=[]; this.speed=1; this.running=false;
    this.hh=null; this.emptySince=-99; this.cool=0; this.fixedDone=new Set();
    this.flags={earlyBones:null, renoType:null, heir:false, reinforced:false};
    this.info={type:ty.name,tag:ty.tag,place:pl.n,birth,families:0,quakes:0,gens:1};
    $('p-name').textContent = pl.n+' ‧ '+ty.name;
    $('p-meta').textContent = '民國'+(birth-1911)+'年落成 ‧ '+ty.tag;
    $('p-res').textContent = '　';
    $('p-house').innerHTML = HOUSE_SVG;
    this.renderStats(true);
    this.pushLog(ty.name+'落成','我被蓋了起來。磚、水泥、鋼筋，和一整個等待被住進來的空。',{});
    this.drawHouse();
    show('s-play');
    this.running=true; this.tick();
  },

  tick(){
    if(!this.running) return;
    this.age += 1;
    $('p-age').textContent=this.age;
    $('p-cal').textContent='民國'+(this.info.birth-1911+this.age)+'年';
    if(this.cool>0) this.cool--;

    // 固定抉擇點
    if(this.age===8 && !this.fixedDone.has(8)){ this.fixedDone.add(8); return this.chooseBones(); }
    if(this.age===30 && !this.fixedDone.has(30)){ this.fixedDone.add(30); return this.chooseReno(); }
    if(this.age===55 && !this.fixedDone.has(55)){ this.fixedDone.add(55); return this.chooseHeir(); }
    // 反思停格
    if(this.age===15 && !this.fixedDone.has(15)){ this.fixedDone.add(15); return this.reflect(15); }
    if(this.age===50 && !this.fixedDone.has(50)){ this.fixedDone.add(50); return this.reflect(50); }

    this.director();

    if(this.age>=80){ clearTimeout(this.timer); this.running=false; setTimeout(()=>this.finish(), 900); return; }
    const base = this.speed===1?640:240;
    this.timer=setTimeout(()=>this.tick(), base + Math.random()*240);
  },

  // 每年導演：決定這年發生什麼
  director(){
    // 1) 沒人住 → 有機會有人搬進來
    if(!this.hh){
      if(this.age - this.emptySince >= (1+Math.floor(Math.random()*3))){
        this.moveIn(); return;
      }
      if(roll(.5)){ this.apply({happy:-5,health:-3,bond:-4}); this.pushLog('空著的日子','又一年沒有人住。燈不亮，水不流，信箱塞滿了廣告。你慢慢懂了什麼叫做寂寞。',{happy:-5,health:-3,bond:-4},'屋齡'+this.age); }
      return;
    }
    const hh=this.hh; hh.tenure++;
    // 2) 住戶劇本 beat（間隔 2–4 年推進）
    if(hh.bi < hh.beats.length && hh.gap<=0){
      const b=hh.beats[hh.bi++]; hh.gap = 2+Math.floor(Math.random()*3);
      this.apply(b.d);
      if(b.res) $('p-res').textContent='｜'+b.res;
      this.pushLog(b.a,b.txt,b.d,'屋齡'+this.age);
      return;
    }
    if(hh.gap>0) hh.gap--;
    // 3) 住戶該搬走了
    if(hh.tenure>=hh.exitAfter && hh.bi>=hh.beats.length){
      return this.moveOut();
    }
    // 4) 地震（屋齡夠大、機率低、未在冷卻）
    if(this.age>=14 && this.cool<=0 && roll(.08)){
      let d={...QUAKE.d};
      if(this.flags.reinforced||this.flags.earlyBones===true){ d.health=Math.round(d.health*0.45); }
      this.info.quakes++; this.cool=4; this.apply(d);
      this.pushLog(QUAKE.a, QUAKE.txt + (this.flags.reinforced? '　還好當年補強過，你傷得比鄰居輕。':''), d,'屋齡'+this.age);
      return;
    }
    // 5) 建築老化事件
    if(this.cool<=0 && roll(.3)){
      const pool=BUILD.filter(e=>this.age>=e.min);
      if(pool.length){
        const e=wpick(pool); let d={...e.d};
        if(e.bones && this.flags.earlyBones===true){ for(const k in d){ if(d[k]<0) d[k]=Math.round(d[k]*0.4);} }
        this.cool=2; this.apply(d);
        this.pushLog(e.a, e.txt + (e.bones&&this.flags.earlyBones===true?'　當年把看不見的基礎做好了，傷得很輕。':''), d,'屋齡'+this.age);
        return;
      }
    }
    // 6) 美好的日常
    if(this.cool<=0 && roll(.34)){
      const pool=GOOD.filter(e=>this.age>=e.min);
      if(pool.length){ const e=wpick(pool); this.cool=2; this.apply(e.d); this.pushLog(e.a,e.txt,e.d,'屋齡'+this.age); return; }
    }
  },

  moveIn(){
    const first=this.info.families===0;
    this.hh=makeHousehold(first,this.age); this.info.families++;
    this.emptySince=-99;
    // 入住第一拍立即觸發
    const b=this.hh.beats[this.hh.bi++]; this.hh.gap=2+Math.floor(Math.random()*3);
    this.apply(b.d); if(b.res)$('p-res').textContent='｜'+b.res;
    this.pushLog(b.a,b.txt,b.d,'屋齡'+this.age);
  },
  moveOut(){
    const sn=this.hh.sn;
    this.hh=null; this.emptySince=this.age;
    $('p-res').textContent='｜房子空了下來';
    this.apply({bond:-10,happy:-5});
    this.pushLog('搬家的紙箱', sn+'家把日子打包進一個個紙箱。新的人會把牆漆成別的顏色，不再知道那道鉛筆線的故事。', {bond:-10,happy:-5},'屋齡'+this.age);
  },

  apply(d){ for(const k in d){ this.st[k]=clamp((this.st[k]||50)+d[k]); } this.renderStats(); this.drawHouse(); },
  avg(){ return (this.st.health+this.st.happy+this.st.func+this.st.bond)/4; },

  // ---------- 抉擇 ----------
  chooseBones(){
    this.pause();
    openModal('屋齡 8 年 ‧ 第一次大裝潢',
      '屋主存夠了錢，想好好整理你一次。',
      '設計師攤開兩張估價單：一張把預算都花在看得見的地方，一張先把看不見的水電、防水、結構做好。屋主轉頭問你——可是你是房子，你不會說話。',
      [
        {label:'<b>先做看得見的</b><small>漂亮的廚房、系統櫃、好看的主牆。預算花在刀口上，親友來都稱讚。</small>',cb:()=>this.setBones(false)},
        {label:'<b>先把看不見的做好</b><small>水電重拉、防水重做、結構補強。表面樸素一點，但骨子裡是好的。</small>',cb:()=>this.setBones(true)},
        {label:'<b>簡單住就好</b><small>不大動，省下來的錢做別的。順其自然。</small>',cb:()=>this.setBones(null)},
      ]);
  },
  setBones(v){
    this.flags.earlyBones=v; closeModal();
    if(v===true){ this.apply({health:16,func:6,happy:2}); this.pushLog('把骨架先顧好','牆被打開、管線重拉、防水重做。整理完那天，表面看起來沒什麼兩樣——但你自己知道，你變得更經得起時間了。',{health:16,func:6,happy:2},'屋齡8'); }
    else if(v===false){ this.apply({func:14,happy:10,health:-2}); this.pushLog('做得很漂亮','嶄新的廚房、整面的櫃子、好看的主牆。親友來了都說讚。只是那些藏在牆裡的老問題，被新的外表好好地蓋住了。',{func:14,happy:10,health:-2},'屋齡8'); }
    else { this.apply({happy:3}); this.pushLog('簡單住就好','沒有大動。日子照過，你維持著剛落成時的樣子，不好不壞。',{happy:3},'屋齡8'); }
    this.resume();
  },

  chooseReno(){
    this.pause();
    openModal('屋齡 30 年 ‧ 老化的十字路口',
      '你老了。',
      '牆在滲水、管線在喊累，年輕人說你格局過時、採光不好。這一年，屋主站在你面前，要做一個決定——',
      [
        {label:'<b>拆掉重建</b><small>一了百了，蓋一棟全新的。但你所有的記憶，也一起歸零。</small>',cb:()=>this.setReno('demo')},
        {label:'<b>將就著住</b><small>貼塊板、補桶漆，能住就好。省錢，繼續漏、繼續舊、繼續撐。</small>',cb:()=>this.setReno('patch')},
        {label:'<b>好好翻新一次</b><small>找真正懂的人，把骨架、管線、採光、動線重新想一遍，留下該留的。</small>',cb:()=>this.setReno('reno')},
      ]);
  },
  setReno(kind){
    this.flags.renoType=kind; closeModal();
    if(kind==='demo'){
      this.apply({health:clamp(92)-this.st.health, func:28, bond:-42, happy:-8});
      this.info.gens=1;
      this.pushLog('拆掉重建','怪手來的那天，鉛筆線、年夜飯、地震夜，一起變成了瓦礫。一棟嶄新的我站了起來，光鮮亮麗，卻誰也不認得。','','屋齡30');
    }else if(kind==='patch'){
      this.apply({health:8, happy:-3, func:2});
      this.pushLog('將就著住','貼了一塊板、補了一桶漆。表面看起來好一點了，只是你知道，真正的問題還在牆裡面慢慢爛。',{health:8,happy:-3},'屋齡30');
    }else{
      const boost = this.flags.earlyBones===true? {health:24,func:26,happy:22,bond:16} : {health:34,func:24,happy:20,bond:14};
      this.apply(boost);
      this.pushLog('好好翻新一次','有一雙手，把你的管線、結構、採光、動線重新想過一遍。保留了那道鉛筆線，拆掉了不該有的隔牆。光回來了。你第一次覺得——老，也可以很好看。',boost,'屋齡30 ‧ 菩語');
      this.flags.reinforced=true;
    }
    this.resume();
  },

  chooseHeir(){
    this.pause();
    const who = this.hh? this.hh.sn+'家' : '最後一任屋主';
    openModal('屋齡 55 年 ‧ 下一代的決定',
      '住在你裡面的人，老了。',
      who+'的長輩走到了要交棒的時候。你的下半生，握在他們這一個決定裡——',
      [
        {label:'<b>賣給建商</b><small>換一筆錢，了無牽掛。你大概會在某一年，被劃進重劃區。</small>',cb:()=>this.setHeir('sell')},
        {label:'<b>當成收租的資產</b><small>隔成套房出租。有穩定的收入，但也不再有誰把你當成家。</small>',cb:()=>this.setHeir('rent')},
        {label:'<b>傳給孩子，繼續住</b><small>孩子帶著自己的孩子搬回來。那道鉛筆線旁邊，又多了一道新的。</small>',cb:()=>this.setHeir('keep')},
      ]);
  },
  setHeir(k){
    closeModal();
    if(k==='sell'){ this.apply({bond:-20,happy:-8}); this.pushLog('賣掉了','成交那天，鑰匙交到一個陌生人手上。你被夾在一疊文件和一個數字裡，等著未知的下一步。',{bond:-20,happy:-8},'屋齡55'); this.hh=null; this.emptySince=this.age; }
    else if(k==='rent'){ this.flags.renoType=this.flags.renoType; this.apply({bond:-14,func:-4,happy:-6}); this.pushLog('成了收租的資產','你被重新隔間、貼上招租紅紙。人來人往，租金準時入帳，只是再沒有人，記得你曾經是誰的家。',{bond:-14,func:-4,happy:-6},'屋齡55'); this.hh=makeHousehold(false,this.age); this.hh.kind='rent'; }
    else { this.flags.heir=true; this.info.gens++; this.apply({bond:22,happy:10}); this.pushLog('傳給下一代','孩子帶著自己的孩子搬了回來。小小的人在你的木地板上學走路，在同一道門框邊，畫下一道新的鉛筆線。你成了一間，有故事的家。',{bond:22,happy:10},'屋齡55 ‧ 傳承'); if(this.hh)$('p-res').textContent='｜'+this.hh.sn+'家 ‧ 第'+this.info.gens+'代'; }
    this.resume();
  },

  reflect(age){
    this.pause();
    const t = age===15
      ? {t:'十五歲的你', b:'你還年輕，卻已經懂得被依賴、被嫌棄、被修補是什麼感覺。這條街上和你同年落成的房子，都還站得好好的。真正的考驗，還在後頭。', o:'繼續看下去'}
      : {t:'五十歲的你', b:'同一條街的老房子，有的拆了、有的空了、有的被隔成了套房。你還站著。站著的理由很簡單——裡面還有人，把你當成一個家。', o:'走完剩下的路'};
    openModal('屋齡 '+age+' 年', t.t, t.b, [{label:'<b>'+t.o+'</b>',cb:()=>{closeModal(); this.resume();}}]);
  },

  pause(){ clearTimeout(this.timer); this.running=false; },
  resume(){ this.running=true; this.tick(); },

  // ---------- 結局 ----------
  finish(){
    this.pause();
    const a=this.avg(), f=this.flags, s=this.st, I=this.info;
    let k,v,epi,ph,mood;
    if(f.renoType==='demo'){
      k='拆除重建'; v='重生，也遺忘'; mood='gone';
      epi='你變成了一棟更高、更亮的大樓。只是夜深人靜時，你偶爾會想起上一個自己——那些被怪手一起帶走的鉛筆線與年夜飯。新的住戶，沒有一個人知道。';
      ph='推倒很快，記憶卻回不來。有些東西，值得先問一句：能不能，不要拆。';
    }else if(f.heir && a>=60){
      k='世代之家'; v='被好好傳下去'; mood='love';
      epi='八十歲了，你還站著，住著同一家人的第'+I.gens+'代。門框邊的鉛筆線，從爺爺畫到了孫子。你不是最新的房子，卻是這條街上，最像「家」的那一間。';
      ph='一間房子最深的福氣，是被同一雙手、好好地愛過三代人。';
    }else if(f.renoType==='reno' && a>=64){
      k='傳家'; v='被好好愛著'; mood='love';
      epi='八十歲了，你還站著，而且比年輕時更美。當年那次好好的翻新，讓你老得有尊嚴。有人說，這間房子有靈魂——他們說對了。';
      ph='真正的好房子，不是新的，是被好好對待過的。';
    }else if(a>=54){
      k='安好'; v='被記得'; mood='ok';
      epi='你不是最漂亮的房子，但你撐過了地震、漏水、一場又一場的搬家。有人在你身上，踏踏實實地活過了一生。這樣，就夠了。';
      ph='一間房子最大的體面，是有人願意一直住下去。';
    }else if(f.renoType==='patch'){
      k='將就'; v='撐著，到最後'; mood='fade';
      epi='你一路將就著走到了八十歲。每一次都只是貼塊板、補桶漆，問題從沒真正被解決。最後的你，又舊又累，像一個從來沒被好好聽懂過的人。';
      ph='將就，是最貴的省錢——省下的每一筆，後來都加倍還了回去。';
    }else{
      k='凋零'; v='被放棄了'; mood='gone';
      epi='最後的日子，燈不常亮了。你撐到了八十歲，卻始終沒等到那雙願意好好修你的手。拆除公告貼上門的那天，沒有人，為你掉一滴淚。';
      ph='房子會老，是正常的；房子被放棄，才是遺憾。早一點好好對待它，結局會很不一樣。';
    }
    $('end-house').innerHTML=HOUSE_SVG;
    setTimeout(()=>this.drawHouse(document.querySelector('#end-house svg'), mood), 60);
    $('end-k').textContent=k;
    $('end-verdict').textContent=v;
    $('end-epitaph').textContent=epi;
    $('end-philo').textContent='「'+ph+'」';
    $('end-stats').innerHTML=
      '<span>屋齡 <b>80</b> 年</span>'+
      '<span>住過 <b>'+I.families+'</b> 戶人家</span>'+
      (I.gens>1?'<span>陪伴 <b>'+I.gens+'</b> 代人</span>':'')+
      '<span>撐過 <b>'+I.quakes+'</b> 次地震</span>'+
      '<span>結構 <b>'+s.health+'</b></span>'+
      '<span>幸福 <b>'+s.happy+'</b></span>'+
      '<span>情感 <b>'+s.bond+'</b></span>';
    this._shareText='我活成了一間在'+I.place+'的'+I.type+'，走完八十年、住過 '+I.families+' 戶人家——結局是「'+v+'」。你的房子，又會活成什麼樣子？';
    show('s-end');
  },

  share(){
    const text=this._shareText+'\n玩玩看《房子的一生》：';
    const url=location.href.split('?')[0];
    if(navigator.share){ navigator.share({title:'房子的一生',text,url}).catch(()=>{}); }
    else{ navigator.clipboard?.writeText(text+' '+url); alert('已複製分享文字，貼給朋友吧 ✦'); }
  },

  toggleSpeed(){ this.speed=this.speed===1?2:1; $('p-speed').textContent=this.speed===1?'▶ 一般':'▶▶ 快轉'; },

  pushLog(a,txt,d,when){
    this.log.unshift({a,txt,d:d||{},when}); if(this.log.length>3) this.log.pop();
    $('p-log').innerHTML=this.log.map(e=>{
      let delta='';
      if(e.d&&Object.keys(e.d).length){
        delta='<div class="delta">'+Object.entries(e.d).map(([k,v])=>{
          const sd=STAT_DEF.find(s=>s.k===k); return sd?((v>0?'＋':'')+v+' '+sd.nm):'';
        }).filter(Boolean).join('　')+'</div>';
      }
      return '<div class="entry"><span class="ea">'+(e.when||'落成')+' ‧ '+e.a+'</span>'+e.txt+delta+'</div>';
    }).join('');
  },
  renderStats(init){
    if(init){
      $('p-stats').innerHTML=STAT_DEF.map(s=>
        '<div class="stat"><span class="nm">'+s.nm+'</span><div class="track"><div class="fill" id="f-'+s.k+'" style="background:'+s.c+'"></div></div><span class="vv" id="v-'+s.k+'">'+this.st[s.k]+'</span></div>'
      ).join('');
    }
    STAT_DEF.forEach(s=>{ const f=$('f-'+s.k), v=$('v-'+s.k); if(f){f.style.width=this.st[s.k]+'%'; v.textContent=this.st[s.k];} });
  },

  // ---------- 房子作畫（隨數值變化） ----------
  drawHouse(svg, moodOverride){
    svg = svg || document.querySelector('#p-house svg');
    if(!svg) return;
    const s=this.st, occupied=!!this.hh, a=this.avg();
    const warmth=(s.health*0.45 + s.happy*0.3 + s.bond*0.25)/100; // 0..1
    // 牆色：冷灰 → 暖奶油
    const wall=lerp3([96,92,86],[214,196,160],warmth);
    const roof=lerp3([70,66,60],[150,112,64],warmth);
    setFill(svg,'wall',wall); setFill(svg,'roof',roof);
    // 窗：點亮數量看幸福×有人住
    const lit = occupied ? Math.round((s.happy/100)*svg.querySelectorAll('.win').length) : (moodOverride==='love'?4:0);
    svg.querySelectorAll('.win').forEach((w,i)=>{
      const on = i<lit;
      w.style.fill = on? '#ffd98a' : '#241c13';
      w.style.opacity = on? 1 : .6;
    });
    const setOp=(id,o)=>{const el=svg.querySelector('#'+id); if(el) el.style.opacity=o;};
    // 裂痕：結構差就出現
    setOp('crack', s.health<62 ? Math.min(1,(62-s.health)/40) : 0);
    // 樹：情感高長出來
    setOp('tree', s.bond>56 ? Math.min(1,(s.bond-56)/30) : 0);
    // 陽光：幸福高灑下來
    setOp('sun', s.happy>66 ? Math.min(.9,(s.happy-66)/30) : 0);
    // 結局特殊
    const mood = moodOverride;
    setOp('sign', mood==='gone'?1:0);
    if(mood==='gone'){ svg.querySelectorAll('.win').forEach(w=>{w.style.fill='#241c13';w.style.opacity=.5;}); setOp('crack',1); setOp('tree',0); setOp('sun',0); }
    if(mood==='love'){ setOp('sun',.9); setOp('tree',1); setOp('crack',0); }
  }
};

function lerp(a,b,t){return a+(b-a)*t;}
function lerp3(c1,c2,t){return 'rgb('+Math.round(lerp(c1[0],c2[0],t))+','+Math.round(lerp(c1[1],c2[1],t))+','+Math.round(lerp(c1[2],c2[2],t))+')';}
function setFill(svg,id,col){const el=svg.querySelector('#'+id); if(el) el.setAttribute('fill',col);}

function show(id){ document.querySelectorAll('.screen').forEach(e=>e.classList.remove('on')); $(id).classList.add('on'); window.scrollTo(0,0); }
function openModal(age,title,body,choices){
  $('m-age').textContent=age; $('m-title').textContent=title; $('m-body').textContent=body;
  $('m-choices').innerHTML='';
  choices.forEach(c=>{ const b=document.createElement('button'); b.className='choice'; b.innerHTML=c.label; b.onclick=c.cb; $('m-choices').appendChild(b); });
  $('modal').classList.add('on');
}
function closeModal(){ $('modal').classList.remove('on'); }
