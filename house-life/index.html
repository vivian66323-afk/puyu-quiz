<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>房子的一生｜菩語國際設計</title>
<meta name="description" content="你出生成一間房子，活過八十年——住戶來了又走、房子老了又被愛。一個關於空間、記憶與翻新的小遊戲。菩語國際設計。">
<meta name="robots" content="noindex">
<meta property="og:title" content="房子的一生｜菩語國際設計">
<meta property="og:description" content="你是一間房子。活過八十年，看看你會被拆掉，還是被好好愛著。">
<meta name="theme-color" content="#1a1613">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15110e; --bg2:#1f1915; --ink:#f4efe8; --sub:#b7ab9c;
    --gold:#c9a86a; --gold-soft:#e3cfa3; --line:#3a3027;
    --health:#8fb3a6; --happy:#e0a86a; --func:#9aa7c7; --bond:#d98c8c;
    --card:#211a15;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Noto Sans TC",sans-serif; background:var(--bg); color:var(--ink);
    min-height:100dvh; line-height:1.7; overflow-x:hidden;
  }
  .serif{font-family:"Noto Serif TC",serif;}
  .wrap{max-width:560px; margin:0 auto; padding:24px 20px 40px; min-height:100dvh; display:flex; flex-direction:column;}
  .screen{display:none; animation:fade .5s ease both;}
  .screen.on{display:flex; flex-direction:column; flex:1;}
  @keyframes fade{from{opacity:0; transform:translateY(8px);}to{opacity:1; transform:none;}}

  /* intro */
  .intro{justify-content:center; text-align:center; gap:4px;}
  .kicker{color:var(--gold); letter-spacing:.35em; font-size:12px; font-weight:700;}
  .title{font-size:40px; font-weight:700; margin:10px 0 4px; letter-spacing:.04em;}
  .lead{color:var(--sub); font-size:16px; max-width:30em; margin:8px auto 0;}
  .rule{width:46px; height:1px; background:var(--gold); margin:26px auto; opacity:.6;}
  .diamond{display:inline-block;width:5px;height:5px;background:var(--gold);transform:rotate(45deg);margin:0 8px;vertical-align:middle;}
  .btn{
    font-family:inherit; cursor:pointer; border:none; border-radius:999px;
    background:linear-gradient(180deg,#d8b878,#b7924f); color:#231a10; font-weight:700;
    font-size:17px; padding:15px 34px; letter-spacing:.08em; transition:transform .15s, filter .15s;
    box-shadow:0 6px 20px rgba(0,0,0,.4);
  }
  .btn:active{transform:translateY(1px) scale(.99);}
  .btn.ghost{background:transparent; color:var(--gold); border:1px solid var(--line); box-shadow:none; font-weight:500;}
  .btn.block{width:100%;}
  .btns{display:flex; flex-direction:column; gap:12px; margin-top:28px;}

  /* play header */
  .id{text-align:center; margin-bottom:6px;}
  .id .name{font-size:22px; font-weight:600; letter-spacing:.03em;}
  .id .meta{color:var(--sub); font-size:13px; letter-spacing:.12em; margin-top:2px;}
  .agebar{display:flex; align-items:baseline; justify-content:center; gap:10px; margin:14px 0 18px;}
  .agebar .yr{font-size:34px; font-weight:700; color:var(--gold-soft);}
  .agebar .lab{color:var(--sub); font-size:13px; letter-spacing:.2em;}

  .stats{display:flex; flex-direction:column; gap:11px; margin:6px 0 16px;}
  .stat{display:flex; align-items:center; gap:10px; font-size:13px;}
  .stat .nm{width:66px; color:var(--sub); flex:none; letter-spacing:.08em;}
  .track{flex:1; height:8px; background:#0e0b09; border-radius:99px; overflow:hidden; border:1px solid #2a221b;}
  .fill{height:100%; width:50%; border-radius:99px; transition:width .9s cubic-bezier(.22,.9,.3,1);}
  .stat .vv{width:30px; text-align:right; color:var(--ink); font-variant-numeric:tabular-nums; flex:none;}

  .log{flex:1; min-height:120px; display:flex; flex-direction:column; gap:10px; margin:6px 0 10px; overflow:hidden;}
  .entry{background:var(--bg2); border:1px solid var(--line); border-radius:14px; padding:12px 15px; font-size:14.5px; animation:fade .5s ease both;}
  .entry .ea{color:var(--gold); font-size:11px; letter-spacing:.14em; font-weight:700; display:block; margin-bottom:3px;}
  .entry .delta{color:var(--sub); font-size:12px; margin-top:5px;}
  .controls{display:flex; justify-content:center; gap:14px; align-items:center; margin-top:4px;}

  /* reflection / choice modal */
  .modal{position:fixed; inset:0; background:rgba(8,6,4,.78); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; padding:22px; z-index:40;}
  .modal.on{display:flex; animation:fade .4s ease both;}
  .sheet{background:linear-gradient(180deg,#241d17,#1b1511); border:1px solid var(--line); border-radius:22px; padding:26px 22px; max-width:440px; width:100%; text-align:center;}
  .sheet .age{color:var(--gold); letter-spacing:.3em; font-size:12px; font-weight:700;}
  .sheet h3{font-family:"Noto Serif TC",serif; font-size:21px; font-weight:600; margin:10px 0 8px; line-height:1.5;}
  .sheet p{color:var(--sub); font-size:14.5px; margin:0 0 6px;}
  .choices{display:flex; flex-direction:column; gap:10px; margin-top:18px;}
  .choice{font-family:inherit; cursor:pointer; text-align:left; background:#15110e; border:1px solid var(--line); color:var(--ink); border-radius:14px; padding:13px 16px; font-size:15px; transition:border-color .15s, background .15s;}
  .choice:active{background:#2a2219;}
  .choice b{color:var(--gold-soft); font-weight:600;}
  .choice small{display:block; color:var(--sub); font-size:12.5px; margin-top:3px;}

  /* ending */
  .end{justify-content:flex-start;}
  .resultcard{background:linear-gradient(170deg,#241d16,#17120e); border:1px solid #4a3c29; border-radius:22px; padding:28px 24px; text-align:center; position:relative; overflow:hidden;}
  .resultcard:before{content:""; position:absolute; inset:0; background:radial-gradient(120% 60% at 50% 0%, rgba(201,168,106,.14), transparent 70%); pointer-events:none;}
  .verdict-k{color:var(--gold); letter-spacing:.3em; font-size:11px; font-weight:700;}
  .verdict{font-family:"Noto Serif TC",serif; font-size:30px; font-weight:700; margin:8px 0 2px; color:var(--gold-soft);}
  .epitaph{color:var(--ink); font-size:15.5px; margin:14px 2px 0; line-height:1.85;}
  .statline{display:flex; justify-content:center; flex-wrap:wrap; gap:6px 16px; margin:20px 0 4px; color:var(--sub); font-size:12.5px; letter-spacing:.06em;}
  .statline b{color:var(--ink); font-weight:600;}
  .philo{font-family:"Noto Serif TC",serif; color:var(--gold-soft); font-size:16px; margin-top:20px; padding-top:18px; border-top:1px solid var(--line); line-height:1.9;}
  .brand{color:var(--sub); font-size:11px; letter-spacing:.24em; margin-top:16px;}
  .cta{margin-top:26px;}
  .cta .lead{margin-bottom:14px; font-size:14px;}
  small.foot{display:block; text-align:center; color:#6b6052; font-size:11px; margin-top:26px; letter-spacing:.08em;}
  a{color:inherit;}
</style>
</head>
<body>
<div class="wrap">

  <!-- INTRO -->
  <section id="s-intro" class="screen on intro">
    <div class="kicker">PURELY ｜ 房子的一生</div>
    <h1 class="title serif">房子的一生</h1>
    <p class="lead">這一次，你不是住在房子裡的人。<br>你，就是那間房子。</p>
    <div class="rule"></div>
    <p class="lead" style="font-size:14.5px">住戶會搬進來、又離開；你會漏水、會老、會被嫌棄，<br>也會在某一年，被一雙手好好地重新愛過。<br><br>八十年，就在你腳下走完。<br>看看最後——你會被拆掉，還是被記得。</p>
    <div class="btns">
      <button class="btn block" onclick="Game.start()">讓我出生 →</button>
    </div>
    <small class="foot">約 2 分鐘 ‧ 建議手機直向遊玩</small>
  </section>

  <!-- PLAY -->
  <section id="s-play" class="screen">
    <div class="id">
      <div class="name serif" id="p-name">—</div>
      <div class="meta" id="p-meta">—</div>
    </div>
    <div class="agebar"><span class="yr serif" id="p-age">0</span><span class="lab">歲</span></div>
    <div class="stats" id="p-stats"></div>
    <div class="log" id="p-log"></div>
    <div class="controls">
      <button class="btn ghost" id="p-speed" onclick="Game.toggleSpeed()">▶ 一般</button>
    </div>
  </section>

  <!-- ENDING -->
  <section id="s-end" class="screen end">
    <div class="resultcard" id="end-card">
      <div class="verdict-k" id="end-k">結局</div>
      <div class="verdict serif" id="end-verdict">—</div>
      <div class="epitaph" id="end-epitaph">—</div>
      <div class="statline" id="end-stats"></div>
      <div class="philo serif" id="end-philo">—</div>
      <div class="brand">菩語國際設計 ‧ PURELY DESIGN</div>
    </div>
    <div class="cta">
      <p class="lead">你的家，也正在它的某一年。<br>想好好對待它的下一段人生嗎？</p>
      <div class="btns">
        <a class="btn block" id="cta-book" href="https://www.purely2006.com/" target="_blank" rel="noopener">聊聊你家的可能 →</a>
        <a class="btn ghost block" href="https://vivian66323-afk.github.io/puyu-quiz/" target="_blank" rel="noopener">測測你家是哪種家</a>
        <button class="btn ghost block" id="btn-share" onclick="Game.share()">分享這間房子的一生</button>
        <button class="btn ghost block" onclick="location.reload()">再活一次</button>
      </div>
    </div>
    <small class="foot">房子的一生 ‧ 菩語國際設計出品</small>
  </section>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="sheet">
    <div class="age" id="m-age">—</div>
    <h3 class="serif" id="m-title">—</h3>
    <p id="m-body">—</p>
    <div class="choices" id="m-choices"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const wpick=arr=>{let t=arr.reduce((s,x)=>s+x.w,0),r=Math.random()*t;for(const x of arr){if((r-=x.w)<=0)return x;}return arr[arr.length-1];};
const clamp=n=>Math.max(0,Math.min(100,Math.round(n)));

const STAT_DEF=[
  {k:'health',nm:'結構健康',c:'var(--health)'},
  {k:'happy', nm:'居住幸福',c:'var(--happy)'},
  {k:'func',  nm:'空間機能',c:'var(--func)'},
  {k:'bond',  nm:'屋主情感',c:'var(--bond)'},
];

const TYPES=[
  {w:34,name:'五層公寓',tag:'無電梯 ‧ 步登公寓',s:{health:62,happy:58,func:52,bond:55}},
  {w:24,name:'電梯華廈',tag:'中坪數 ‧ 電梯',    s:{health:70,happy:60,func:64,bond:52}},
  {w:20,name:'電梯大樓',tag:'社區 ‧ 管理員',    s:{health:74,happy:56,func:68,bond:46}},
  {w:14,name:'連棟透天',tag:'三四層 ‧ 自己的門', s:{health:60,happy:64,func:60,bond:62}},
  {w:8, name:'獨棟透天',tag:'有庭院 ‧ 一家人的城堡',s:{health:66,happy:68,func:66,bond:70}},
];
const PLACES=[
  {w:30,n:'桃園'},{w:26,n:'新北'},{w:16,n:'台北'},{w:14,n:'台中'},{w:14,n:'其他縣市'}
];

// life events by age band  d = stat deltas
const EVENTS=[
  {age:[1,3],t:'第一戶人家',a:'喬遷之喜',txt:'一對年輕夫妻搬了進來，油漆的味道還沒散。他們說，這就是家了。',d:{happy:8,bond:10}},
  {age:[2,6],t:'新生命',a:'添丁',txt:'半夜的哭聲、牆上的塗鴉、一道量身高的鉛筆線。你第一次被人這樣依賴著。',d:{bond:10,happy:6,func:-5}},
  {age:[4,9],t:'一次裝潢',a:'小翻修',txt:'屋主換了廚房、打開一道牆。你覺得自己變得更懂他們要的生活了。',d:{func:10,happy:5,health:-3}},
  {age:[6,14],t:'屋頂的雨',a:'漏水',txt:'一道水痕悄悄爬上天花板。沒人發現，直到壁癌開了花。',d:{health:-12,happy:-6}},
  {age:[8,20],t:'樓上的腳步',a:'鄰損',txt:'樓上整修打到了你的樑。你痛，但沒人聽得見房子喊痛。',d:{health:-9}},
  {age:[10,22],t:'搬家的紙箱',a:'屋主更替',txt:'第一家人走了。新的人把牆漆成別的顏色，不再知道那道鉛筆線的故事。',d:{bond:-16,happy:-4}},
  {age:[12,26],t:'出租',a:'房客來去',txt:'你被隔成了套房。人們住一年就走，沒有人記得你的名字。',d:{bond:-10,func:-6,happy:-6}},
  {age:[14,40],t:'大地','a':'地震',txt:'天搖地動的那一夜，你用盡全身的鋼筋撐住了裡面的人。牆裂了，但他們都活著。',d:{health:-14,bond:8}},
  {age:[18,30],t:'加蓋',a:'頂樓違建',txt:'屋頂多了一層鐵皮。你變重了，夏天也更熱了。',d:{health:-7,func:4,happy:-4}},
  {age:[20,35],t:'房市','a':'一紙漲幅',txt:'仲介在你門口拍照。人們談論你值多少錢，卻沒人問你過得好不好。',d:{happy:-5}},
  {age:[22,45],t:'空著的日子',a:'空屋',txt:'有幾年，沒有人住。燈不亮，水不流。你學會了什麼叫做寂寞。',d:{happy:-12,health:-6,bond:-8}},
];
const GOOD=[
  {age:[5,12],t:'一桌年夜飯',a:'團圓',txt:'除夕夜，你被每一盞燈、每一句笑都填滿了。這一刻，你知道自己不只是鋼筋水泥。',d:{happy:10,bond:8}},
  {age:[15,40],t:'種在窗邊的光',a:'日常',txt:'午後的陽光斜斜地走進來，落在木地板上。住在你裡面的人，深深吸了一口氣。',d:{happy:8,health:3}},
];

const Game={
  st:null, age:0, timer:null, speed:1, running:false, log:[], history:[], used:new Set(), reno:null,
  milestones:[15,30,50], msDone:new Set(),

  start(){
    const ty=wpick(TYPES), pl=wpick(PLACES);
    const birth=1965+Math.floor(Math.random()*42); // 1965-2006
    this.st={...ty.s}; this.age=0; this.log=[]; this.history=[]; this.used=new Set(); this.msDone=new Set(); this.reno=null; this.speed=1;
    this.info={type:ty.name,tag:ty.tag,place:pl.n,birth, families:1, quakes:0};
    $('p-name').textContent = pl.n+' ‧ '+ty.name;
    $('p-meta').textContent = '民國'+(birth-1911)+'年落成 ‧ '+ty.tag;
    this.renderStats(true);
    this.pushLog(ty.name+'落成','我被蓋了起來。磚、水泥、鋼筋，和一整個等待被住進來的空。',{});
    show('s-play');
    this.run();
  },
  run(){ this.running=true; this.tick(); },
  tick(){
    if(!this.running) return;
    this.age += 1;
    $('p-age').textContent=this.age;
    // milestone reflections
    if(this.milestones.includes(this.age) && !this.msDone.has(this.age)){
      this.msDone.add(this.age); this.reflect(this.age); return;
    }
    // random events roughly every 3-5 yrs
    if(this.age>=2 && Math.random()<0.34){ this.fireEvent(); }
    if(this.age>=80){ this.finish(); return; }
    const base = this.speed===1?620:230;
    this.timer=setTimeout(()=>this.tick(), base + Math.random()*260);
  },
  fireEvent(){
    const pool = (Math.random()<0.78?EVENTS:GOOD).filter(e=>this.age>=e.age[0]&&this.age<=e.age[1]&&!this.used.has(e.a));
    if(!pool.length) return;
    const e=pick(pool); this.used.add(e.a);
    if(e.a==='地震') this.info.quakes++;
    if(e.a==='屋主更替') this.info.families++;
    this.apply(e.d); this.pushLog(e.a,e.txt,e.d,'屋齡'+this.age);
  },
  apply(d){ for(const k in d){ this.st[k]=clamp((this.st[k]||50)+d[k]); } this.renderStats(); },
  avg(){ return (this.st.health+this.st.happy+this.st.func+this.st.bond)/4; },

  reflect(age){
    clearTimeout(this.timer); this.running=false;
    if(age===30){ return this.renoChoice(); }
    const texts={
      15:{t:'十五歲的你',b:'第一代住戶的孩子長大了，開始嫌你舊、嫌你小。你還撐得很好，只是沒人記得你剛落成時，是多麼被期待。',opt:'繼續看下去'},
      50:{t:'五十歲的你',b:'同一條街的老房子，有的拆了、有的空了。你還站著。站著的理由，是裡面還有人把你當成家。',opt:'走完剩下的路'}
    };
    const o=texts[age];
    openModal('屋齡 '+age+' 年', o.t, o.b, [{label:'<b>'+o.opt+'</b>',cb:()=>{closeModal(); this.running=true; this.tick();}}]);
  },
  renoChoice(){
    openModal('屋齡 30 年 ‧ 老化的十字路口',
      '你老了。',
      '牆在滲水，管線在喊累，年輕人說你格局過時。這一年，屋主站在你面前，做一個決定——',
      [
        {label:'<b>拆掉重建</b><small>一了百了。但你所有的記憶，也一起歸零。</small>',cb:()=>this.setReno('demo')},
        {label:'<b>將就著住</b><small>省錢。繼續漏、繼續舊，也繼續撐。</small>',cb:()=>this.setReno('patch')},
        {label:'<b>好好翻新一次</b><small>找懂的人，把骨架、管線、採光重做一遍。</small>',cb:()=>this.setReno('reno')},
      ]);
  },
  setReno(kind){
    this.reno=kind; closeModal();
    if(kind==='demo'){
      this.apply({health:100-this.st.health, func:30, bond:-40, happy:-10});
      this.pushLog('拆掉重建','怪手來的那天，鉛筆線、年夜飯、地震夜，一起變成了瓦礫。一棟新的我站了起來，光鮮，卻誰也不認得。',{},'屋齡30');
    }else if(kind==='patch'){
      this.apply({health:6, happy:-4});
      this.pushLog('將就著住','貼了一塊板、補了一桶漆。日子照過，只是你知道，問題還在裡面慢慢爛。',{},'屋齡30');
    }else{
      this.apply({health:34, func:26, happy:20, bond:16});
      this.pushLog('好好翻新一次','有一雙手，把你的管線、結構、採光重新想過一遍。保留了那道鉛筆線，拆掉了不該有的隔牆。光回來了。你第一次覺得，老，也可以很好看。',{},'屋齡30 ‧ 菩語');
    }
    this.running=true; this.tick();
  },

  finish(){
    clearTimeout(this.timer); this.running=false;
    const a=this.avg(), r=this.reno, s=this.st;
    let k='結局', v, epi, ph;
    if(r==='reno' && a>=66){
      v='被好好愛著'; k='傳家';
      epi='八十歲了，你還站著，而且比年輕時更美。孩子的孩子在你的木地板上學走路。有人說，這間房子有靈魂——他們說對了。';
      ph='真正的好房子，不是新的，是被好好對待過的。';
    }else if(r==='demo'){
      v='重生，也遺忘'; k='拆除重建';
      epi='你變成了一棟全新的大樓，更高、更亮。只是夜深時，你偶爾會想起上一個自己——那些被怪手一起帶走的鉛筆線與年夜飯。';
      ph='推倒很快，記憶卻回不來。有些東西，值得先問問能不能留。';
    }else if(a>=55){
      v='被記得'; k='安好';
      epi='你不是最漂亮的房子，但你撐過了地震、漏水和一場又一場的搬家。有人在你身上，好好地活過了一生。這樣就夠了。';
      ph='一間房子最大的體面，是有人願意一直住下去。';
    }else{
      v='老去，凋零'; k='凋零';
      epi='最後的日子，燈不常亮了。你撐到了八十歲，卻沒能等到那雙願意好好修你的手。拆除公告貼上門的那天，沒有人掉淚。';
      ph='房子會老，是正常的；房子被放棄，才是遺憾。早一點好好對待它，結局會很不一樣。';
    }
    $('end-k').textContent=k;
    $('end-verdict').textContent=v;
    $('end-epitaph').textContent=epi;
    $('end-philo').textContent='「'+ph+'」';
    $('end-stats').innerHTML=
      '<span>屋齡 <b>80</b> 年</span>'+
      '<span>住過 <b>'+this.info.families+'</b> 戶人家</span>'+
      '<span>撐過 <b>'+this.info.quakes+'</b> 次地震</span>'+
      '<span>結構 <b>'+s.health+'</b></span>'+
      '<span>幸福 <b>'+s.happy+'</b></span>'+
      '<span>情感 <b>'+s.bond+'</b></span>';
    this._shareText='我活成了一間在'+this.info.place+'的'+this.info.type+'，走完八十年——結局是「'+v+'」。你的房子，又會活成什麼樣子？';
    show('s-end');
  },
  share(){
    const text=this._shareText+'\n玩玩看《房子的一生》：';
    const url=location.href.split('?')[0];
    if(navigator.share){ navigator.share({title:'房子的一生',text,url}).catch(()=>{}); }
    else{ navigator.clipboard?.writeText(text+' '+url); alert('已複製分享文字，貼給朋友吧 ✦'); }
  },

  toggleSpeed(){ this.speed=this.speed===1?2:1; $('p-speed').textContent=this.speed===1?'▶ 一般':'▶▶ 快轉'; },
  pushLog(a,txt,d,when){
    this.log.unshift({a,txt,d,when}); if(this.log.length>3) this.log.pop();
    const html=this.log.map(e=>{
      let delta='';
      if(e.d&&Object.keys(e.d).length){
        delta='<div class="delta">'+Object.entries(e.d).map(([k,v])=>{
          const nm=STAT_DEF.find(s=>s.k===k).nm; return (v>0?'＋':'')+v+' '+nm;
        }).join('　')+'</div>';
      }
      return '<div class="entry"><span class="ea">'+(e.when||'落成')+' ‧ '+e.a+'</span>'+e.txt+delta+'</div>';
    }).join('');
    $('p-log').innerHTML=html;
  },
  renderStats(init){
    if(init){
      $('p-stats').innerHTML=STAT_DEF.map(s=>
        '<div class="stat"><span class="nm">'+s.nm+'</span><div class="track"><div class="fill" id="f-'+s.k+'" style="background:'+s.c+'"></div></div><span class="vv" id="v-'+s.k+'">'+this.st[s.k]+'</span></div>'
      ).join('');
    }
    STAT_DEF.forEach(s=>{ const f=$('f-'+s.k), v=$('v-'+s.k); if(f){f.style.width=this.st[s.k]+'%'; v.textContent=this.st[s.k];} });
  }
};
function show(id){ document.querySelectorAll('.screen').forEach(e=>e.classList.remove('on')); $(id).classList.add('on'); window.scrollTo(0,0); }
function openModal(age,title,body,choices){
  $('m-age').textContent=age; $('m-title').textContent=title; $('m-body').textContent=body;
  $('m-choices').innerHTML='';
  choices.forEach(c=>{ const b=document.createElement('button'); b.className='choice'; b.innerHTML=c.label; b.onclick=c.cb; $('m-choices').appendChild(b); });
  $('modal').classList.add('on');
}
function closeModal(){ $('modal').classList.remove('on'); }
</script>
</body>
</html>
