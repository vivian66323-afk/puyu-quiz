<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>菩語｜客戶生活需求調查表</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1A1A1A;--cream:#F5F2EC;--gold:#B08D57;--gold-soft:#D9C4A3;--gold-txt:#7A5C2E;--paper:#FBFAF6;--line:#E3DDD1;--muted:#7A756B;--sel:#FBF6EC}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{font-family:"Noto Sans TC",sans-serif;background:var(--cream);color:var(--ink);line-height:1.7;font-weight:300;height:100%;overflow:hidden}
#app{max-width:1080px;margin:0 auto;height:100%}
.screen{display:none}.screen.on{display:block;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
a{color:var(--gold-txt)}

.intro{min-height:100vh;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:48px 30px;max-width:600px;margin:0 auto}
.frame{width:96px;height:96px;margin:0 auto 26px;border-radius:2px;position:relative;overflow:hidden;box-shadow:0 18px 44px rgba(26,26,26,.18);background:linear-gradient(135deg,#2a2723,#141210)}
.frame::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 34% 32%,var(--gold-soft) 0 12%,transparent 13%),radial-gradient(circle at 68% 64%,var(--gold) 0 9%,transparent 10%)}
.eyebrow{font-size:12px;letter-spacing:.4em;color:var(--gold-txt);font-weight:500;margin-bottom:16px}
.intro h1{font-family:"Noto Serif TC";font-weight:600;font-size:29px;letter-spacing:.03em;line-height:1.45}
.intro .lead{color:var(--muted);font-size:14.5px;margin:20px auto 0;max-width:440px;line-height:1.95}
.btn{display:inline-block;font-family:inherit;font-size:16px;font-weight:500;cursor:pointer;padding:15px 46px;border-radius:100px;border:1px solid var(--ink);background:var(--ink);color:var(--cream);letter-spacing:.08em;transition:transform .15s;margin-top:30px}
.btn:active{transform:scale(.97)}
.note{font-size:12px;color:var(--muted);margin-top:18px;letter-spacing:.02em}

.wrap{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
@media(max-width:820px){.wrap{grid-template-columns:1fr}.side{display:none}}
.side{background:var(--paper);border-right:1px solid var(--line);padding:32px 24px}
.side .brand{font-family:"Noto Serif TC";font-size:17px;font-weight:600}
.side .sub{font-size:11px;letter-spacing:.3em;color:var(--gold-txt);margin:4px 0 22px}
.pline{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
.track{height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:26px}
.track i{display:block;height:100%;background:var(--gold);transition:width .4s ease;width:0}
.nav{list-style:none}
.nav li{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);padding:9px 0;cursor:pointer}
.nav li .n{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;background:#fff}
.nav li.on{color:var(--ink);font-weight:500}.nav li.on .n{background:var(--gold);border-color:var(--gold);color:#fff}
.nav li.done .n{background:#5B7A6B;border-color:#5B7A6B;color:#fff}.nav li.done{color:#4a4640}

.main{padding:40px 44px 64px;max-width:770px}
@media(max-width:820px){.main{padding:26px 18px 56px}}
.step{font-size:12px;letter-spacing:.3em;color:var(--gold-txt);font-weight:500}
.h2{font-family:"Noto Serif TC";font-size:27px;font-weight:600;margin:8px 0 4px}
.stepnote{font-size:13px;color:var(--muted);line-height:1.8}
.mprog{display:none}@media(max-width:820px){.mprog{display:block;margin:14px 0 4px}.mprog .track{margin-bottom:6px}.mprog .pline{font-size:11.5px}}

.subhead{font-family:"Noto Serif TC";font-size:18px;font-weight:600;color:var(--gold-txt);margin:34px 0 2px;padding-bottom:8px;border-bottom:1px solid var(--gold-soft)}
.desc{font-size:13px;color:var(--muted);background:var(--paper);border-left:3px solid var(--gold-soft);padding:10px 14px;border-radius:0 6px 6px 0;margin-top:14px;line-height:1.8}
.q{margin-top:26px}
.q .qh{font-size:15.5px;font-weight:500;line-height:1.6;margin-bottom:2px}
.q .qh .idx{color:var(--gold-txt);margin-right:7px;font-family:"Noto Serif TC"}
.q .tagm{font-size:11px;color:var(--muted);margin-left:8px;font-weight:400}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{border:1px solid var(--line);border-radius:9px;background:#fff;padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:11px;font-size:14px;color:#3d3a35;transition:all .12s;user-select:none}
.opt:hover{border-color:var(--gold-soft)}.opt:active{transform:scale(.99)}
.opt .box{width:18px;height:18px;border:1.5px solid var(--gold-soft);border-radius:4px;flex-shrink:0;position:relative}
.opt.single .box{border-radius:50%}
.opt.sel{border-color:var(--gold);background:var(--sel)}.opt.sel .box{background:var(--gold);border-color:var(--gold)}
.opt.sel .box::after{content:"";position:absolute;left:5px;top:1.5px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.opt.single.sel .box::after{left:4px;top:4px;width:8px;height:8px;border:none;border-radius:50%;background:#fff;transform:none}
input.qin,textarea.qin{width:100%;border:1px solid var(--line);border-radius:9px;background:#fff;padding:12px 14px;font-family:inherit;font-size:14px;color:#3d3a35;margin-top:11px}
textarea.qin{line-height:1.8;resize:vertical;min-height:110px}
input.qin::placeholder,textarea.qin::placeholder{color:#bcb5a8}
.grp{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:11px}
@media(max-width:560px){.grp{grid-template-columns:1fr}}
.grp .f label{display:block;font-size:12.5px;color:var(--gold-txt);margin-bottom:4px}
.grp .f input{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px 12px;font-family:inherit;font-size:14px;color:#3d3a35}
.grp .f.wide{grid-column:1/-1}
.mxwrap{overflow-x:auto;margin-top:12px}
table.mx{border-collapse:collapse;font-size:13px;min-width:100%}
table.mx th,table.mx td{border:1px solid var(--line);padding:8px 6px;text-align:center;background:#fff}
table.mx th{background:var(--paper);color:var(--gold-txt);font-weight:500;white-space:nowrap}
table.mx td.rl{text-align:left;color:#3d3a35;white-space:nowrap;font-weight:400;background:var(--paper)}
table.mx .cell{cursor:pointer}
table.mx .cell .dot{width:16px;height:16px;border:1.5px solid var(--gold-soft);border-radius:50%;margin:0 auto;position:relative}
table.mx .cell.sel .dot{background:var(--gold);border-color:var(--gold)}
table.mx .cell.sel .dot::after{content:"";position:absolute;left:4px;top:4px;width:6px;height:6px;border-radius:50%;background:#fff}

.footer{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:22px;border-top:1px solid var(--line)}
.back{font-size:14px;color:var(--muted);background:none;border:none;cursor:pointer;font-family:inherit}
.next{font-family:inherit;font-size:15px;font-weight:500;padding:13px 34px;border-radius:100px;border:none;background:var(--ink);color:var(--cream);cursor:pointer;letter-spacing:.06em;transition:transform .15s}
.next:active{transform:scale(.97)}
.tip{font-size:12.5px;color:var(--muted);margin-top:8px}

.sumhead{text-align:center;padding:30px 0 8px}
.sumhead .k{font-size:12px;letter-spacing:.3em;color:var(--gold-txt)}
.sumhead h1{font-family:"Noto Serif TC";font-size:28px;font-weight:600;margin-top:8px}
.sumhead p{font-size:13.5px;color:var(--muted);margin-top:8px}
.hl{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 8px}
.hl .p{background:var(--ink);color:var(--cream);border-radius:10px;padding:12px 16px;font-family:"Noto Serif TC";font-size:14.5px;flex:1;min-width:150px}
.hl .p em{display:block;font-style:normal;font-size:11px;color:var(--gold-soft);letter-spacing:.1em;margin-bottom:3px}
.sumsec{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:16px;overflow:hidden}
.sumsec .st{background:var(--ink);color:var(--cream);padding:12px 20px;font-family:"Noto Serif TC";font-size:15px;font-weight:600}
.sumsec .sb{padding:6px 20px 16px}
.sumrow{padding:11px 0;border-bottom:1px dashed var(--line)}.sumrow:last-child{border-bottom:none}
.sumrow .sq{font-size:12.5px;color:var(--muted);margin-bottom:5px}
.sumrow .sa{font-size:14px;color:#2d2a25}
.sumrow .sa .chip{display:inline-block;background:var(--paper);border:1px solid var(--gold-soft);color:var(--gold-txt);border-radius:100px;font-size:12.5px;padding:2px 11px;margin:3px 5px 3px 0}
.sumrow .sa.free{font-family:"Noto Serif TC";line-height:1.9;white-space:pre-wrap}
.sumrow .sa.empty{color:#c2bbae;font-size:12.5px}
.sumactions{display:flex;gap:12px;justify-content:center;margin:26px 0 8px;flex-wrap:wrap}
.pbtn{font-family:inherit;font-size:15px;font-weight:500;padding:14px 30px;border-radius:100px;cursor:pointer;letter-spacing:.05em;border:1px solid var(--ink)}
.pbtn.solid{background:var(--gold);border-color:var(--gold);color:#fff}
.pbtn.ghost{background:transparent;color:var(--ink)}

@media print{.side,.footer,.sumactions,.mprog,#sendTip{display:none!important}body{background:#fff}.wrap{display:block}.main{max-width:none;padding:0}
  .sumsec{break-inside:avoid;box-shadow:none}.sumsec .st,.hl .p{background:#1A1A1A!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div id="app">
  <section class="screen on" id="s-intro">
    <div class="intro">
      <div class="frame"></div>
      <div class="eyebrow">PURELY · 客戶生活需求調查表</div>
      <h1>簽約了。<br>從這一刻起，我們一起進入設計階段。</h1>
      <p class="lead">這份表單是起點。您想了很久的那個家，會從這裡的每一個答案開始長出來——櫃子多深、廚房開不開放、床放哪一面，都來自您真實的生活。<br><br>沒有標準答案。請照現在與未來真正的生活方式填。所有資料只用於本案設計，不會對外提供。</p>
      <div><button class="btn" onclick="start()">開始填寫</button></div>
      <div class="note">約 20–25 分鐘 · 進度自動保存，可隨時關掉再回來</div>
    </div>
  </section>

  <section class="screen" id="s-form">
    <div class="wrap">
      <aside class="side">
        <div class="brand">菩語國際設計</div>
        <div class="sub">需求調查表</div>
        <div class="pline"><span id="pText">已完成 0 題</span><span id="pPct">0%</span></div>
        <div class="track"><i id="bar"></i></div>
        <ul class="nav" id="nav"></ul>
      </aside>
      <div class="main"><div id="body"></div>
        <div class="footer">
          <button class="back" id="backBtn" onclick="prev()">← 上一步</button>
          <button class="next" id="nextBtn" onclick="next()">下一步 →</button>
        </div>
      </div>
    </div>
  </section>

  <section class="screen" id="s-sum"><div class="main" style="max-width:820px;margin:0 auto"><div id="sumBody"></div></div></section>
</div>

<script>
/* ========= 題庫：菩語客戶生活需求調查表（A–G 七段，82 題）＝資料，好增刪 ========= */
const BRIEF = [
{key:'A',title:'A｜基本資料',intro:'合約上已有的資料不用重填，這裡只確認會直接影響設計溝通的部分。',items:[
 {id:'a1',q:'這份表單由誰填寫？',t:'single',o:['屋主本人','配偶／伴侶','家人代填','夫妻／家人一起填']},
 {id:'a2',q:'家中的主要決策者是？（設計討論時需要知道誰拍板）',t:'single',o:['我本人','配偶／伴侶','兩人共同決定','其他']},
 {id:'a3',q:'學歷（家中最高學歷）',t:'single',o:['高中職以下','專科','大學','研究所以上']},
 {id:'a4',q:'科系或專業領域（影響書籍量、工作設備與閱讀空間）',t:'text',ph:'例：建築、護理、資訊工程'},
 {id:'a5',q:'職業（本人／配偶）',t:'multi',o:['企業經營者／老闆','高階主管','一般上班族','專業人士（醫師律師會計師工程師等）','公教人員','教師','服務業／技術人員','自由工作者／接案','家管','退休','其他']},
 {id:'a6',q:'工作型態',t:'multi',o:['外出上班','在家工作','輪班','常出差、旅行']},
 {id:'a7',q:'在家工作的話，一週約幾天？',t:'text',ph:'例：2 天'},
 {id:'a8',q:'聯絡方式（若合約已提供可略）',t:'group',fields:[
   {k:'name',label:'姓名',t:'text'},{k:'bd',label:'生日',t:'date'},{k:'phone',label:'電話',t:'text'},
   {k:'line',label:'LINE ID',t:'text'},{k:'email',label:'E-mail',t:'text'},{k:'addr',label:'案件地址',t:'text',wide:true}]},
]},
{key:'B',title:'B｜房屋狀況',items:[
 {id:'b1',q:'房屋類型',t:'single',o:['預售屋（客變階段）','新成屋','中古屋','自地自建','商業／辦公空間']},
 {id:'b2',q:'中古屋請填屋齡',t:'text',ph:'例：25 年'},
 {id:'b3',q:'基本條件',t:'group',fields:[
   {k:'ping',label:'室內坪數',t:'text',ph:'例：32 坪'},{k:'geju',label:'格局',t:'text',ph:'例：3房2廳2衛'},
   {k:'floor',label:'樓層',t:'text',ph:'例：8 樓'}]},
 {id:'b4',q:'電梯（影響材料搬運與費用）',t:'single',o:['有電梯','無電梯']},
 {id:'b5',q:'這個空間的使用目的',t:'single',o:['長期自住','假日／度假使用','出租','未來出售']},
 {id:'b6',q:'這個家預計住多久？（決定材料等級與預留彈性）',t:'single',o:['5 年內可能再依生活調整','預計居住 10～15 年','希望作為退休後長住的家','希望一生安心居住，不打算搬家']},
 {id:'b7',q:'需要規劃的空間（沒列到的請填在下方）',t:'multi',o:['玄關','客廳','餐廳','廚房','主臥','次臥','小孩房','客房／孝親房','書房／工作室','更衣室','儲藏室','佛堂／神明廳','洗衣／工作陽台']},
 {id:'b7b',q:'其他要規劃的空間',t:'text'},
 {id:'b8',q:'希望的完工入住時間',t:'single',o:['3 個月內','3～6 個月','6 個月～1 年','不急，品質優先','其他（特殊狀況請說明）']},
 {id:'b9',q:'社區是否有施工規定（施工時段、保證金、電梯保護等）？',t:'single',o:['有，已取得規定文件','有，尚未取得','沒有管委會','不確定']},
 {id:'b10',q:'要保留使用的現有家具、家電（品項＋大約尺寸，也可拍照傳設計師群組相簿）',t:'area',ph:'例：餐桌 180×90、雙門冰箱、鋼琴'},
]},
{key:'C',title:'C｜居住成員與未來變化',intro:'空間是為人設計的。誰住、幾歲、未來會怎麼變，比風格更優先。',items:[
 {id:'c1',q:'本人／配偶',t:'single',o:['1 人（自己住）','2 人（夫妻／伴侶）']},
 {id:'c2',q:'其他居住成員（各類成員的人數）',t:'matrix',rows:['父母／長輩','小孩','其他同住者','幫傭／看護'],cols:['0','1','2','3','4 位以上']},
 {id:'c3',q:'各成員年齡與特殊需求（身高、慣用手、行動狀況）',t:'area',ph:'例：本人 42、太太 40、女兒 8、母親 70（膝蓋不好）'},
 {id:'c4',q:'毛小孩',t:'multi',o:['貓','小型犬','中型犬','大型犬','沒有','其他']},
 {id:'c5',q:'毛小孩數量與需求',t:'text',ph:'例：貓 2 隻，需要跳台與貓砂區'},
 {id:'c6',q:'未來 3～5 年家庭可能的變化',t:'multi',o:['迎接新生兒','小孩長大需要獨立房間','長輩搬來同住','小孩離家','開始在家工作','增加寵物','沒有預期的變化']},
 {id:'c7',q:'需要特別考慮的需求',t:'multi',o:['長輩／行動不便：無障礙、扶手、防滑','幼兒安全：防撞、防夾、圍欄','過敏／氣喘：低甲醛、少布料、易清潔','祭祀空間：神明桌、佛堂、祖先牌位','視訊會議／在家工作','樂器練習或影音需要隔音','沒有特別需求']},
 {id:'c8',q:'行動能力的預留（家中有長輩或行動不便者才填）',t:'single',o:['目前不需要特別規劃','希望減少門檻與跌倒風險','需預留助行器／輪椅動線','已有明確的行動不便需求']},
 {id:'c9',q:'衛浴安全最希望優先改善的',t:'multi',o:['乾濕分離與止滑','無高差入口','扶手補強與可坐式洗浴','夜間照明與緊急求助','目前不需要']},
 {id:'c10',q:'照護與同住的彈性',t:'single',o:['不需要','希望客房可彈性轉換','需預留照護者同住空間','需規劃長輩獨立生活區']},
 {id:'c11',q:'家人作息',t:'single',o:['大致相同，早睡早起','大致相同，晚睡晚起','作息差異大（需考慮隔音、分區照明）','輪班，不固定']},
 {id:'c12',q:'家人在家最常見的狀態',t:'multi',o:['各自活動，彼此保有安靜空間','多數時間在公共空間相聚','工作、學習與休息經常交錯','作息差異大，需要互不干擾']},
 {id:'c13',q:'社交型態',t:'single',o:['以家人相處為主，很少有客人','常有朋友來訪聚會','偶爾有客人']},
 {id:'c14',q:'聚會通常是什麼型態？',t:'multi',o:['影音娛樂（看電影、唱歌、聽音樂）','美食聚會（下廚、小酌、品酒）','桌遊、電玩、麻將','泡茶、咖啡聊天','小孩玩伴聚會','家族聚餐、節慶團圓','運動、瑜珈、健身','手作、烘焙、插花','其他']},
 {id:'c15',q:'常有聚會的話，一次最多約幾人？',t:'text',ph:'例：10 人'},
]},
{key:'D',title:'D｜生活習慣',intro:'每一題都對應一個空間決定。照真實習慣填，不用想「應該」怎樣。',items:[
 {sub:'餐廚'},
 {id:'d1',q:'在家開伙的頻率',t:'single',o:['幾乎每天','每週 3～5 次','每週 1～2 次','幾乎不開伙']},

const el=id=>document.getElementById(id);
const KEY='puyu_brief_v2';
/* 填入 Google Apps Script 部署後的 /exec 網址 → 客戶按「送出給菩語」自動寄回 */
const CONFIG={SUBMIT_URL:''};

let cur=0; const LAST=BRIEF.length-1;
const A={ans:{}};
function save(){try{localStorage.setItem(KEY,JSON.stringify({cur,ans:A.ans}));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.ans){A.ans=d.ans;}}catch(e){}}

/* 題目計數 */
function allQs(){const a=[];BRIEF.forEach(s=>s.items.forEach(it=>{if(it.id)a.push(it);}));return a;}
function isAns(it){const v=A.ans[it.id];
  if(it.t==='multi')return Array.isArray(v)&&v.length>0;
  if(it.t==='group')return v&&Object.keys(v).some(k=>v[k]);
  if(it.t==='matrix')return v&&Object.keys(v).length>0;
  return !!v;}
function answered(){return allQs().filter(isAns).length;}

function scrollTop0(){const s=document.querySelector('.screen.on');if(s)s.scrollTop=0;try{window.scrollTo(0,0);}catch(e){}
  /* 嵌入時通知外層 Wix 頁把本 iframe 捲回頂端（解決跳頁停在中間） */
  try{window.parent.postMessage({puyuBrief:'top'},'*');}catch(e){}}
function start(){el('s-intro').classList.remove('on');el('s-form').classList.add('on');render();scrollTop0();}

function progress(){
  const tot=allQs().length,ans=answered(),pct=Math.round(ans/tot*100);
  el('pText').textContent='已完成 '+ans+' / '+tot+' 題';el('pPct').textContent=pct+'%';el('bar').style.width=pct+'%';
  const mb=el('mb');if(mb){mb.style.width=pct+'%';el('mt').textContent='已完成 '+ans+' / '+tot+'　·　'+pct+'%';}
  el('nav').innerHTML=BRIEF.map((s,i)=>{
    const done=s.items.filter(it=>it.id).every(isAns);
    const cls=i===cur?'on':(done?'done':'');
    return '<li class="'+cls+'" onclick="jump('+i+')"><span class="n">'+(done&&i!==cur?'✓':(i+1))+'</span>'+s.title.replace(/｜/,' ')+'</li>';
  }).join('');
}
function jump(i){if(i<=cur){cur=i;render();}}

function esc(s){return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;');}
function av(s){return (s||'').replace(/"/g,'&quot;');}

function render(){
  const s=BRIEF[cur];
  el('backBtn').style.visibility=cur===0?'hidden':'visible';
  el('nextBtn').textContent=cur===LAST?'完成 · 產出需求摘要':'下一步 →';
  let h='<div class="step">'+s.key+' · 第 '+(cur+1)+' / '+BRIEF.length+' 段</div><div class="h2">'+s.title.replace(/^[A-G]｜/,'')+'</div>';
  if(s.intro)h+='<div class="stepnote">'+s.intro+'</div>';
  h+='<div class="mprog"><div class="track"><i id="mb"></i></div><div class="pline" id="mt"></div></div>';
  let qn=0;
  s.items.forEach(it=>{
    if(it.sub){h+='<div class="subhead">'+it.sub+'</div>';return;}
    qn++;
    h+='<div class="q"><div class="qh"><span class="idx">'+qn+'.</span>'+it.q+
       (it.t==='single'?'<span class="tagm">單選</span>':it.t==='multi'?'<span class="tagm">可複選</span>':'')+'</div>';
    h+=field(it);
    h+='</div>';
  });
  el('body').innerHTML=h;progress();scrollTop0();
}
function field(it){
  const v=A.ans[it.id];
  if(it.t==='single'||it.t==='multi'){
    const multi=it.t==='multi';const cur2=v||(multi?[]:'');
    return '<div class="opts">'+it.o.map(op=>{
      const sel=multi?cur2.indexOf(op)>=0:cur2===op;
      return '<div class="opt '+(multi?'':'single')+(sel?' sel':'')+'" onclick="pick(\''+it.id+'\',\''+esc(op)+'\','+multi+')"><span class="box"></span>'+op+'</div>';
    }).join('')+'</div>';
  }
  if(it.t==='text')return '<input class="qin" value="'+av(v)+'" placeholder="'+av(it.ph)+'" oninput="setVal(\''+it.id+'\',this.value)">';
  if(it.t==='area')return '<textarea class="qin" placeholder="'+av(it.ph)+'" oninput="setVal(\''+it.id+'\',this.value)">'+(v||'')+'</textarea>';
  if(it.t==='date')return '<input type="date" class="qin" value="'+av(v)+'" oninput="setVal(\''+it.id+'\',this.value)">';
  if(it.t==='group'){
    const g=v||{};
    return '<div class="grp">'+it.fields.map(f=>{
      let inner;
      if(f.t==='single'){inner='<div class="opts" style="margin-top:6px">'+f.o.map(op=>{const sel=g[f.k]===op;return '<div class="opt single'+(sel?' sel':'')+'" onclick="setGrp(\''+it.id+'\',\''+f.k+'\',\''+esc(op)+'\')"><span class="box"></span>'+op+'</div>';}).join('')+'</div>';}
      else{const type=f.t==='date'?'date':'text';inner='<input type="'+type+'" value="'+av(g[f.k])+'" placeholder="'+av(f.ph)+'" oninput="setGrp(\''+it.id+'\',\''+f.k+'\',this.value)">';}
      return '<div class="f'+(f.wide||f.t==='single'?' wide':'')+'"><label>'+f.label+'</label>'+inner+'</div>';
    }).join('')+'</div>';
  }
  if(it.t==='matrix'){
    const m=v||{};
    let h='<div class="mxwrap"><table class="mx"><tr><th></th>'+it.cols.map(c=>'<th>'+c+'</th>').join('')+'</tr>';
    it.rows.forEach(r=>{h+='<tr><td class="rl">'+r+'</td>'+it.cols.map(c=>'<td class="cell'+(m[r]===c?' sel':'')+'" onclick="setMx(\''+it.id+'\',\''+esc(r)+'\',\''+esc(c)+'\')"><div class="dot"></div></td>').join('')+'</tr>';});
    return h+'</table></div>';
  }
  return '';
}
function pick(id,op,multi){if(multi){const a=A.ans[id]||[];const i=a.indexOf(op);if(i>=0)a.splice(i,1);else a.push(op);A.ans[id]=a;}else A.ans[id]=op;save();render();}
function setVal(id,val){A.ans[id]=val;save();progress();}
function setGrp(id,k,val){const g=A.ans[id]||{};g[k]=val;A.ans[id]=g;save();if(BRIEF[cur].items.find(x=>x.id===id).fields.find(f=>f.k===k).t==='single')render();else progress();}
function setMx(id,r,c){const m=A.ans[id]||{};m[r]=c;A.ans[id]=m;save();render();}

function next(){if(cur===LAST){buildSummary();return;}cur++;render();}
function prev(){if(cur>0){cur--;render();}}

/* ========= 需求摘要 ========= */
function featVal(f){let r=null;BRIEF.forEach(s=>s.items.forEach(it=>{if(it.feature===f)r=A.ans[it.id];}));return r;}
function clientObj(){return A.ans['a8']||{};}
function ansText(it){const v=A.ans[it.id];
  if(v==null||(Array.isArray(v)&&!v.length)||(typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length)||v==='')return null;
  if(Array.isArray(v))return v.join('、');
  if(it.t==='group')return it.fields.filter(f=>v[f.k]).map(f=>f.label+'：'+v[f.k]).join('　');
  if(it.t==='matrix')return Object.keys(v).map(r=>r+'→'+v[r]).join('；');
  return v;}
function buildSummary(){
  save();const c=clientObj();
  let h='<div class="sumhead"><div class="k">菩語國際設計 · 客戶生活需求調查表</div><h1>需求摘要</h1>'+
    '<p>'+(c.name?c.name:'')+(A.ans['b3']&&A.ans['b3'].ping?'　·　'+A.ans['b3'].ping:'')+(c.phone?'　·　'+c.phone:'')+'</p></div>';
  const prio=featVal('prio'),trade=featVal('trade'),story=featVal('story');
  if((prio&&prio.length)||trade){
    h+='<div class="hl">';
    if(prio&&prio.length)h+='<div class="p"><em>最優先</em>'+prio.join('　')+'</div>';
    if(trade)h+='<div class="p"><em>取捨傾向</em>'+trade+'</div>';
    h+='</div>';
  }
  BRIEF.forEach(s=>{
    let rows='';
    s.items.forEach(it=>{ if(!it.id)return; const a=ansText(it);
      rows+='<div class="sumrow"><div class="sq">'+it.q+'</div>'+
        (a?(it.feature==='story'?'<div class="sa free">'+escH(a)+'</div>':'<div class="sa">'+(Array.isArray(A.ans[it.id])?A.ans[it.id].map(x=>'<span class="chip">'+x+'</span>').join(''):(it.t==='single'?'<span class="chip">'+a+'</span>':escH(a)))+'</div>')
             :'<div class="sa empty">—</div>')+'</div>';
    });
    h+='<div class="sumsec"><div class="st">'+s.title+'</div><div class="sb">'+rows+'</div></div>';
  });
  h+='<div class="sumactions">'+
    '<button class="pbtn solid" id="sendBtn" onclick="submitToStudio()">送出給菩語</button>'+
    '<button class="pbtn ghost" onclick="window.print()">列印 / 存成 PDF</button>'+
    '<button class="pbtn ghost" onclick="backToEdit()">← 回去修改</button></div>'+
    '<div class="tip" id="sendTip" style="text-align:center">按「送出給菩語」把需求直接傳給我們；也可以另存 PDF 留底。</div>';
  el('sumBody').innerHTML=h;el('s-form').classList.remove('on');el('s-sum').classList.add('on');scrollTop0();
}
function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function backToEdit(){el('s-sum').classList.remove('on');el('s-form').classList.add('on');cur=LAST;render();}

function summaryText(){
  const c=clientObj();let t='【菩語 · 客戶生活需求摘要】\n';
  t+='客戶：'+(c.name||'—')+'　電話：'+(c.phone||'—')+'　Email：'+(c.email||'—')+'\n';
  t+='地址：'+(c.addr||'—')+'\n';
  const prio=featVal('prio'),trade=featVal('trade');
  t+='最優先：'+((prio&&prio.join('、'))||'—')+'　取捨：'+(trade||'—')+'\n\n';
  BRIEF.forEach(s=>{t+='＝＝'+s.title+'＝＝\n';s.items.forEach(it=>{if(!it.id)return;const a=ansText(it);t+='· '+it.q+'\n   → '+(a||'—')+'\n';});t+='\n';});
  return t;
}
function submitToStudio(){
  const btn=el('sendBtn'),tip=el('sendTip');
  if(!CONFIG.SUBMIT_URL){tip.textContent='（自動寄送尚未設定，請先用「列印 / 存成 PDF」回傳）';return;}
  btn.disabled=true;btn.textContent='送出中…';
  const body=new URLSearchParams();
  body.set('summary',summaryText());body.set('client',JSON.stringify(clientObj()));body.set('data',JSON.stringify(A.ans));
  fetch(CONFIG.SUBMIT_URL,{method:'POST',mode:'no-cors',body})
    .then(()=>{btn.textContent='✓ 已送出';tip.textContent='已送給菩語，我們會盡快與您約下一次討論。謝謝您這麼用心填寫。';try{localStorage.removeItem(KEY);}catch(e){}})
    .catch(()=>{btn.disabled=false;btn.textContent='送出給菩語';tip.textContent='送出失敗，請改用「列印 / 存成 PDF」回傳，或稍後再試。';});
}

load();
</script>
</body>
