<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>菩語｜居家深度需求單</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1A1A1A;--cream:#F5F2EC;--gold:#B08D57;--gold-soft:#D9C4A3;--gold-txt:#7A5C2E;--paper:#FBFAF6;--line:#E3DDD1;--muted:#7A756B;--sel:#FBF6EC}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Noto Sans TC",sans-serif;background:var(--cream);color:var(--ink);line-height:1.7;font-weight:300}
#app{max-width:1080px;margin:0 auto;min-height:100vh}
.screen{display:none}.screen.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
a{color:var(--gold-txt)}

/* intro */
.intro{min-height:100vh;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:48px 30px;max-width:560px;margin:0 auto}
.frame{width:96px;height:96px;margin:0 auto 26px;border-radius:2px;position:relative;overflow:hidden;box-shadow:0 18px 44px rgba(26,26,26,.18);background:linear-gradient(135deg,#2a2723,#141210)}
.frame::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 34% 32%,var(--gold-soft) 0 12%,transparent 13%),radial-gradient(circle at 68% 64%,var(--gold) 0 9%,transparent 10%)}
.eyebrow{font-size:12px;letter-spacing:.4em;color:var(--gold-txt);font-weight:500;margin-bottom:16px}
.intro h1{font-family:"Noto Serif TC";font-weight:600;font-size:30px;letter-spacing:.03em;line-height:1.4}
.intro .lead{color:var(--muted);font-size:15px;margin:20px auto 0;max-width:420px;line-height:1.95}
.dims{margin:28px 0 30px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.dims span{font-size:12.5px;color:var(--gold-txt);border:1px solid var(--gold-soft);border-radius:100px;padding:5px 13px;background:var(--paper)}
.btn{display:inline-block;font-family:inherit;font-size:16px;font-weight:500;cursor:pointer;padding:15px 46px;border-radius:100px;border:1px solid var(--ink);background:var(--ink);color:var(--cream);letter-spacing:.08em;transition:transform .15s}
.btn:active{transform:scale(.97)}
.note{font-size:12px;color:var(--muted);margin-top:18px;letter-spacing:.02em}

/* layout with sidebar */
.wrap{display:grid;grid-template-columns:236px 1fr;gap:0;min-height:100vh}
@media(max-width:820px){.wrap{grid-template-columns:1fr}.side{display:none}}
.side{background:var(--paper);border-right:1px solid var(--line);padding:32px 24px}
.side .brand{font-family:"Noto Serif TC";font-size:17px;font-weight:600;letter-spacing:.02em}
.side .sub{font-size:11px;letter-spacing:.3em;color:var(--gold-txt);margin:4px 0 22px}
.side .pline{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
.track{height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:26px}
.track i{display:block;height:100%;background:var(--gold);transition:width .4s ease;width:0}
.nav{list-style:none}
.nav li{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);padding:9px 0;cursor:pointer;transition:color .15s}
.nav li .n{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;background:#fff}
.nav li.on{color:var(--ink);font-weight:500}
.nav li.on .n{background:var(--gold);border-color:var(--gold);color:#fff}
.nav li.done .n{background:#5B7A6B;border-color:#5B7A6B;color:#fff}
.nav li.done{color:#4a4640}

.main{padding:40px 44px 64px;max-width:760px}
@media(max-width:820px){.main{padding:28px 20px 56px}}
.step{font-size:12px;letter-spacing:.3em;color:var(--gold-txt);font-weight:500}
.h2{font-family:"Noto Serif TC";font-size:27px;font-weight:600;margin:8px 0 4px;letter-spacing:.02em}
.stepnote{font-size:13px;color:var(--muted);margin-bottom:6px}
.mprog{display:none}
@media(max-width:820px){.mprog{display:block;margin:2px 0 22px}.mprog .track{margin-bottom:6px}.mprog .pline{font-size:11.5px;color:var(--muted)}}

.q{margin-top:30px}
.q .qh{font-size:16px;font-weight:500;line-height:1.6;margin-bottom:4px}
.q .qh .idx{color:var(--gold-txt);margin-right:8px;font-family:"Noto Serif TC"}
.q .req{color:#B26B4A;font-size:12px;margin-left:6px}
.q .qhint{font-size:12.5px;color:var(--muted);margin:2px 0 12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{border:1px solid var(--line);border-radius:9px;background:#fff;padding:13px 15px;cursor:pointer;display:flex;align-items:center;gap:11px;font-size:14px;color:#3d3a35;transition:all .13s;user-select:none}
.opt:hover{border-color:var(--gold-soft)}
.opt:active{transform:scale(.985)}
.opt .box{width:18px;height:18px;border:1.5px solid var(--gold-soft);border-radius:4px;flex-shrink:0;position:relative;transition:all .13s}
.opt.single .box{border-radius:50%}
.opt.sel{border-color:var(--gold);background:var(--sel)}
.opt.sel .box{background:var(--gold);border-color:var(--gold)}
.opt.sel .box::after{content:"";position:absolute;left:5px;top:1.5px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.opt.single.sel .box::after{left:4px;top:4px;width:8px;height:8px;border:none;border-radius:50%;background:#fff;transform:none}

textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:#fff;padding:14px;font-family:inherit;font-size:14px;line-height:1.8;color:#3d3a35;resize:vertical;min-height:130px}
textarea::placeholder{color:#b9b2a5}
input.txt{width:100%;border:1px solid var(--line);border-radius:9px;background:#fff;padding:12px 14px;font-family:inherit;font-size:14px;color:#3d3a35}
.field{margin-bottom:16px}.field label{display:block;font-size:12.5px;color:var(--gold-txt);margin-bottom:6px;letter-spacing:.04em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:560px){.grid2{grid-template-columns:1fr}}

.footer{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:22px;border-top:1px solid var(--line)}
.back{font-size:14px;color:var(--muted);background:none;border:none;cursor:pointer;font-family:inherit;letter-spacing:.03em}
.back:active{color:var(--gold)}
.next{font-family:inherit;font-size:15px;font-weight:500;padding:13px 34px;border-radius:100px;border:none;background:var(--ink);color:var(--cream);cursor:pointer;letter-spacing:.06em;transition:transform .15s}
.next:active{transform:scale(.97)}
.next:disabled{background:var(--line);color:#a9a396;cursor:default}
.warn{font-size:12.5px;color:#B26B4A;margin-top:14px;min-height:16px}

/* priority */
.prio{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:16px}
@media(max-width:560px){.prio{grid-template-columns:1fr}}
.pcard{border:1px solid var(--line);border-radius:10px;background:#fff;padding:16px;cursor:pointer;transition:all .13s;position:relative}
.pcard:active{transform:scale(.98)}
.pcard b{font-family:"Noto Serif TC";font-size:15.5px;font-weight:600;display:block}
.pcard span{font-size:12px;color:var(--muted);display:block;margin-top:3px}
.pcard.sel{border-color:var(--gold);background:var(--sel)}
.pcard .rank{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#fff;font-family:"Noto Serif TC";font-size:13px;display:none;align-items:center;justify-content:center}
.pcard.sel .rank{display:flex}

/* summary */
.sumhead{text-align:center;padding:30px 0 8px}
.sumhead .k{font-size:12px;letter-spacing:.3em;color:var(--gold-txt)}
.sumhead h1{font-family:"Noto Serif TC";font-size:28px;font-weight:600;margin-top:8px}
.sumhead p{font-size:13.5px;color:var(--muted);margin-top:8px}
.sumbar{display:flex;gap:10px;justify-content:center;margin:18px 0 30px;flex-wrap:wrap}
.sumsec{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:16px;overflow:hidden}
.sumsec .st{background:var(--ink);color:var(--cream);padding:12px 20px;font-family:"Noto Serif TC";font-size:15px;font-weight:600;display:flex;gap:10px;align-items:baseline}
.sumsec .st .num{color:var(--gold-soft);font-size:12px}
.sumsec .sb{padding:6px 20px 16px}
.sumrow{padding:12px 0;border-bottom:1px dashed var(--line)}
.sumrow:last-child{border-bottom:none}
.sumrow .sq{font-size:13px;color:var(--muted);margin-bottom:5px}
.sumrow .sa{font-size:14.5px;color:#2d2a25}
.sumrow .sa .chip{display:inline-block;background:var(--paper);border:1px solid var(--gold-soft);color:var(--gold-txt);border-radius:100px;font-size:13px;padding:3px 12px;margin:3px 6px 3px 0}
.sumrow .sa.free{font-family:"Noto Serif TC";line-height:1.9;white-space:pre-wrap}
.sumrow .sa.empty{color:#b9b2a5;font-size:13px}
.prio-sum{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.prio-sum .p{background:var(--ink);color:var(--cream);border-radius:10px;padding:12px 16px;font-family:"Noto Serif TC";font-size:15px;flex:1;min-width:150px}
.prio-sum .p em{display:block;font-style:normal;font-size:11px;color:var(--gold-soft);letter-spacing:.1em;margin-bottom:3px}
.sumactions{display:flex;gap:12px;justify-content:center;margin:26px 0 10px;flex-wrap:wrap}
.pbtn{font-family:inherit;font-size:15px;font-weight:500;padding:14px 30px;border-radius:100px;cursor:pointer;letter-spacing:.05em;border:1px solid var(--ink)}
.pbtn.solid{background:var(--gold);border-color:var(--gold);color:#fff}
.pbtn.ghost{background:transparent;color:var(--ink)}
.tip{text-align:center;font-size:12.5px;color:var(--muted);margin-top:8px}

@media print{
  .side,.footer,.sumbar,.sumactions,.tip,.mprog{display:none!important}
  body{background:#fff}.wrap{display:block}.main{max-width:none;padding:0}
  .sumsec{break-inside:avoid;box-shadow:none}
  .sumsec .st{background:#1A1A1A!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .prio-sum .p{background:#1A1A1A!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="app">

  <!-- INTRO -->
  <section class="screen on" id="s-intro">
    <div class="intro">
      <div class="frame"></div>
      <div class="eyebrow">PURELY · LIVING BRIEF</div>
      <h1>你的家，<br>九個生活重點</h1>
      <p class="lead">這不是問卷，是我們一起把「你想怎麼生活」說清楚的過程。<br>沒有標準答案，請依你現在與未來真正的生活方式作答——你答得越具體，我們的設計就越貼近你。</p>
      <div class="dims" id="introDims"></div>
      <div><button class="btn" onclick="start()">開始填寫</button></div>
      <div class="note">約 8–12 分鐘 · 進度會自動保存，可隨時關掉再回來</div>
    </div>
  </section>

  <!-- FORM -->
  <section class="screen" id="s-form">
    <div class="wrap">
      <aside class="side">
        <div class="brand">菩語國際設計</div>
        <div class="sub">LIVING BRIEF</div>
        <div class="pline"><span id="pText">已完成 0 題</span><span id="pPct">0%</span></div>
        <div class="track"><i id="bar"></i></div>
        <ul class="nav" id="nav"></ul>
      </aside>
      <div class="main">
        <div id="body"></div>
        <div class="warn" id="warn"></div>
        <div class="footer">
          <button class="back" id="backBtn" onclick="prev()">← 上一步</button>
          <button class="next" id="nextBtn" onclick="next()">下一步 →</button>
        </div>
      </div>
    </div>
  </section>

  <!-- SUMMARY -->
  <section class="screen" id="s-sum">
    <div class="main" style="max-width:820px;margin:0 auto">
      <div id="sumBody"></div>
    </div>
  </section>

</div>

<script>
/* ============ 題庫（9 重點 + 收尾）＝v1 草稿，皆為資料，好增刪 ============ */
const M = 'multi', S = 'single';
const BRIEF = [
 {key:'family', title:'家庭與生活動線', qs:[
   {id:'f1', q:'未來 5–10 年，預計哪些成員會共同居住？', t:M, o:['自己','伴侶','學齡前或學齡子女','成年子女','父母或長輩','毛小孩','可能同住的照護者']},
   {id:'f2', q:'家中最常同時出現的生活狀態是？', t:M, o:['各自活動，彼此保有安靜空間','多數時間在公共空間相聚','工作、學習與休息經常交錯','作息差異大，需要互不干擾']},
   {id:'f3', q:'在家工作或學習的頻率？', t:S, o:['幾乎沒有','每週 1–2 天','每週 3 天以上','多人同時，需要固定工作/學習區']},
   {id:'f4', q:'家中有哪些成員或物品需要特別納入設計？', t:M, o:['貓/狗等寵物','大量衣物或收藏','運動/樂器設備','大型行李或季節用品','嬰幼兒','行動輔具','無特別項目']},
 ]},
 {key:'storage', title:'收納與儲物', qs:[
   {id:'s1', q:'目前最頭痛的收納問題？', t:M, o:['玄關鞋物太多','衣物換季難處理','廚房備品雜亂','書籍與文件','孩子玩具','收藏品沒地方陳列','清潔家電無處收','家裡沒有儲藏室']},
   {id:'s2', q:'你偏好的收納原則？', t:S, o:['盡量藏起來、看不見最好','展示與收藏並重','好拿好歸位優先','依使用頻率分區分層']},
   {id:'s3', q:'有沒有需要「專屬空間」的收藏或嗜好？', t:M, o:['酒藏','茶具','書籍','公仔/模型','包款/鞋款','運動器材','樂器','無']},
 ]},
 {key:'kitchen', title:'廚房與餐食', qs:[
   {id:'k1', q:'平日在家料理的頻率？', t:S, o:['很少，主要外食','每週 1–3 次簡單料理','幾乎每天料理','常多人一起備餐或宴客']},
   {id:'k2', q:'最常進行哪些料理或飲食活動？', t:M, o:['中式煎炒/重油煙','烘焙/甜點','咖啡/茶/輕食','火鍋/多人聚餐','健康餐/生鮮備料']},
   {id:'k3', q:'廚房目前最想改善的是？', t:M, o:['檯面不足、操作不順','電器多、插座或散熱不足','收納分類與庫存管理','油煙與氣味擴散','料理時無法和家人互動']},
   {id:'k4', q:'餐桌在家中還需要扮演哪些角色？', t:M, o:['日常用餐','親友聚會','工作/閱讀/孩子作業','手作/插花/興趣活動','正式宴客']},
 ]},
 {key:'bath', title:'衛浴與盥洗', qs:[
   {id:'b1', q:'主衛浴你最重視哪些條件？', t:M, o:['乾濕分離','泡澡浴缸','雙洗手槽','大量收納','採光與通風','精緻質感']},
   {id:'b2', q:'盥洗的習慣與需求？', t:M, o:['以淋浴為主','喜歡泡澡放鬆','早晚尖峰需兩人同時使用','需要化妝/梳理區','需要更衣/曬衣銜接']},
   {id:'b3', q:'衛浴收納最需要放哪些？', t:M, o:['備品囤貨','瓶罐分類','毛巾浴巾','吹風機等家電','清潔用品']},
 ]},
 {key:'health', title:'健康與環境', qs:[
   {id:'h1', q:'你或家人是否有下列健康敏感狀況？', t:M, o:['過敏/氣喘','對氣味或化學物質敏感','睡眠品質不穩定','怕冷、怕熱或濕度敏感','無明顯狀況']},
   {id:'h2', q:'對室內空氣品質最在意的是？', t:M, o:['通風與悶熱','除濕與防霉','PM2.5/粉塵過濾','異味與油煙','希望設備自動維持']},
   {id:'h3', q:'你對採光與日照的偏好？', t:S, o:['明亮開放，盡量引入自然光','柔和不刺眼，可依時段調整','重視遮陽與隔熱，不追求大量日照','不同空間有不同光環境']},
   {id:'h4', q:'在材料與清潔方面，最重視哪些條件？', t:M, o:['低甲醛、低 VOC','防霉、抗菌、耐潮','好清潔、減少死角','天然觸感與可回收性','耐刮耐撞、容易維修']},
 ]},
 {key:'soft', title:'軟裝與風格美學', qs:[
   {id:'a1', q:'哪一種空間氛圍最打動你？（可多選）', t:M, o:['溫潤自然的木質感','侘寂留白的安靜','精緻俐落的飯店感','有故事的古典/收藏','現代簡約','大膽有個性','柔和療癒']},
   {id:'a2', q:'你偏好的色調方向？', t:M, o:['奶霧裸色','大地木石','暗調奢華','柔霧粉彩','清爽北歐','復古黃銅','低調黑白灰']},
   {id:'a3', q:'軟裝這幾項，哪些你重視、也想一起挑選？', t:M, o:['窗簾/布藝','沙發/單椅','寢具/織品','地毯','掛畫/藝術品','花藝/植栽','燈飾','餐瓷/杯器']},
   {id:'a4', q:'有沒有想保留、融入新家的舊物或收藏？', t:S, o:['有家傳家具想留','有藝術/收藏品要陳列','有旅行帶回的物件','想全部換新','再與設計師討論']},
   {id:'a5', q:'希望家給人的第一印象/情緒是？', t:S, o:['安靜、放鬆','溫暖、有人味','俐落、有品味','獨特、有故事','明亮、有活力']},
 ]},
 {key:'relax', title:'影音娛樂與放鬆', qs:[
   {id:'r1', q:'在家最常進行哪些影音或休閒活動？', t:M, o:['電影/影集','音樂/黑膠/演奏','遊戲','運動/瑜伽','閱讀/靜坐']},
   {id:'r2', q:'影音空間希望達到什麼程度？', t:S, o:['一般電視與背景音樂即可','重視畫質、音質與設備整合','希望接近家庭劇院的沉浸感','多人可同時享受不同內容']},
   {id:'r3', q:'為提升放鬆品質，你會優先選擇？', t:M, o:['遮光與情境照明','隔音與吸音','舒適座椅與觀看距離','隱藏設備與線材','能快速恢復為一般客廳']},
   {id:'r4', q:'需要一個「只屬於自己」的角落嗎？', t:S, o:['需要，一個閱讀角','需要，一個獨處放空區','需要，一間工作書房','不需要']},
 ]},
 {key:'smart', title:'智慧與設備', qs:[
   {id:'m1', q:'最希望智慧系統協助哪些日常？', t:M, o:['燈光與窗簾情境','空調、換氣與除濕','門鎖、監控與緊急通知','影音設備一鍵啟動','能源監測與節能','目前偏好傳統操作']},
   {id:'m2', q:'對智慧控制方式的偏好？', t:S, o:['手機 App 為主','實體按鍵為主、App 輔助','語音加自動感測','先預留線路，未來再擴充']},
   {id:'m3', q:'網路與設備上的需求？', t:M, o:['全屋 WiFi 無死角','大量智慧家電','居家辦公/視訊','高品質影音串流','監視與安防','電動車充電樁']},
 ]},
 {key:'senior', title:'銀齡長住／無障礙', qs:[
   {id:'e1', q:'希望這個家能支持多長期的居住計畫？', t:S, o:['5 年內可依生活再調整','預計居住 10–15 年','希望作為退休後長住宅','希望一生安心居住、不必搬家']},
   {id:'e2', q:'是否需要預先考量行動能力的改變？', t:M, o:['目前不需要特別規劃','希望減少門檻與跌倒風險','需預留助行器/輪椅動線','已有明確行動不便需求']},
   {id:'e3', q:'衛浴安全最希望優先改善哪些項目？', t:M, o:['乾濕分離與止滑','無高差入口','扶手補強與可坐式洗浴','夜間照明與緊急求助']},
   {id:'e4', q:'是否需要保留照護或跨代同住的彈性？', t:M, o:['不需要','希望客房可彈性轉換','需預留照護者同住空間','需規劃長輩獨立生活區']},
 ]},
];
const TITLES = BRIEF.map(s=>s.title);
const TRADEOFF = ['寧可少做，但用好材質','寧可先做滿機能，日後再升級','公共空間優先','主臥與私領域優先','看設計師的專業建議'];

/* ============ 狀態 ============ */
let cur = 0;                 // 0..8 = 9 面向；9 = 排序；10 = 開放/取捨；11 = 客戶資料
const LAST = 11;
const A = { ans:{}, prio:[], tradeoff:'', story:'', client:{name:'',phone:'',email:'',proj:'',addr:''} };
const el = id => document.getElementById(id);
const KEY = 'puyu_brief_v1';
/* 填入 Google Apps Script 部署後的 /exec 網址 → 客戶按「送出給菩語」就自動寄回 */
const CONFIG = { SUBMIT_URL: '' };

function save(){ try{ localStorage.setItem(KEY, JSON.stringify({cur,A})); }catch(e){} }
function load(){ try{ const d=JSON.parse(localStorage.getItem(KEY)); if(d&&d.A){ Object.assign(A,d.A); return true; } }catch(e){} return false; }

function totalQ(){ let n=0; BRIEF.forEach(s=>n+=s.qs.length); return n+3; } // +排序+取捨+開放
function answeredQ(){
  let n=0;
  BRIEF.forEach(s=>s.qs.forEach(q=>{ const v=A.ans[q.id]; if(Array.isArray(v)?v.length:!!v) n++; }));
  if(A.prio.length===3) n++;
  if(A.tradeoff) n++;
  if(A.story && A.story.trim()) n++;
  return n;
}

/* ============ intro ============ */
el('introDims').innerHTML = TITLES.map(t=>'<span>'+t+'</span>').join('');
function start(){ el('s-intro').classList.remove('on'); el('s-form').classList.add('on'); render(); window.scrollTo(0,0); }

/* ============ 進度 / 側欄 ============ */
function refreshProgress(){
  const tot=totalQ(), ans=answeredQ(), pct=Math.round(ans/tot*100);
  el('pText').textContent='已完成 '+ans+' / '+tot+' 題';
  el('pPct').textContent=pct+'%'; el('bar').style.width=pct+'%';
  const mp=el('mprogBar'); if(mp){ mp.style.width=pct+'%'; el('mprogText').textContent='已完成 '+ans+' / '+tot+'　·　'+pct+'%'; }
  el('nav').innerHTML = BRIEF.map((s,i)=>{
    const done = s.qs.every(q=>{const v=A.ans[q.id];return Array.isArray(v)?v.length:!!v;});
    const cls = i===cur?'on':(done?'done':'');
    return '<li class="'+cls+'" onclick="jump('+i+')"><span class="n">'+(done&&i!==cur?'✓':(i+1))+'</span>'+s.title+'</li>';
  }).join('') +
   ['排序重點','理想與取捨','客戶與案件'].map((t,k)=>{
     const i=9+k; return '<li class="'+(i===cur?'on':'')+'" onclick="jump('+i+')"><span class="n">'+(i+1)+'</span>'+t+'</li>';
   }).join('');
}
function jump(i){ if(i<=cur){ cur=i; render(); } }

/* ============ render ============ */
function render(){
  el('warn').textContent='';
  el('backBtn').style.visibility = cur===0 ? 'hidden':'visible';
  el('nextBtn').textContent = cur===LAST ? '完成 · 產出需求摘要' : '下一步 →';
  let html='';
  if(cur<9){
    const s=BRIEF[cur];
    html+='<div class="step">STEP '+String(cur+1).padStart(2,'0')+' / 09</div>';
    html+='<div class="h2">'+s.title+'</div>';
    html+='<div class="stepnote">憑你真實的生活作答，可複選；沒有標準答案。</div>';
    html+='<div class="mprog"><div class="track"><i id="mprogBar"></i></div><div class="pline" id="mprogText"></div></div>';
    s.qs.forEach((q,qi)=>{
      const cur2=A.ans[q.id]||(q.t===M?[]:'');
      html+='<div class="q"><div class="qh"><span class="idx">'+(qi+1)+'.</span>'+q.q+(q.t===M?'':'<span class="req">單選</span>')+'</div>';
      html+='<div class="opts">'+q.o.map(op=>{
        const sel = q.t===M ? cur2.indexOf(op)>=0 : cur2===op;
        return '<div class="opt '+(q.t===S?'single':'')+(sel?' sel':'')+'" onclick="pick(\''+q.id+'\',\''+esc(op)+'\','+(q.t===M)+')"><span class="box"></span>'+op+'</div>';
      }).join('')+'</div></div>';
    });
  } else if(cur===9){
    html+='<div class="step">最後幾步 · 排序</div><div class="h2">若只能先做到位三件事</div>';
    html+='<div class="stepnote">從九大重點中選出你最在意的 3 個（依序點選），這會決定我們把心力與預算優先放哪裡。</div>';
    html+='<div class="prio">'+TITLES.map((t,i)=>{
      const idx=A.prio.indexOf(i);
      return '<div class="pcard'+(idx>=0?' sel':'')+'" onclick="pickPrio('+i+')"><span class="rank">'+(idx>=0?idx+1:'')+'</span><b>'+t+'</b><span>重點 '+(i+1)+'</span></div>';
    }).join('')+'</div>';
  } else if(cur===10){
    html+='<div class="step">最後幾步 · 想法</div><div class="h2">理想的家，與你的取捨</div>';
    html+='<div class="q"><div class="qh">當預算需要取捨時，你比較傾向？<span class="req">單選</span></div>';
    html+='<div class="opts">'+TRADEOFF.map(op=>'<div class="opt single'+(A.tradeoff===op?' sel':'')+'" onclick="pickTrade(\''+esc(op)+'\')"><span class="box"></span>'+op+'</div>').join('')+'</div></div>';
    html+='<div class="q"><div class="qh">請描述你理想中的家，或最不希望新家再次發生的問題。<span class="req">必填</span></div>';
    html+='<div class="qhint">寫得越具體越好，情境句最有幫助。</div>';
    html+='<textarea id="story" oninput="A.story=this.value;save()" placeholder="例如：希望一家人在公共空間相聚，但晚上彼此不受聲音干擾；也希望未來父母偶爾同住時仍然安全舒適。上一個家最困擾的是玄關永遠很亂、廚房油煙會飄到客廳……">'+(A.story||'')+'</textarea></div>';
  } else if(cur===11){
    html+='<div class="step">最後一步</div><div class="h2">確認客戶與案件</div>';
    html+='<div class="stepnote">方便我們把這份需求單對應到你的案子。</div>';
    html+='<div class="grid2" style="margin-top:22px">'+
      field('name','姓名')+field('phone','聯絡電話')+field('email','Email')+field('proj','案名 / 稱呼')+'</div>'+
      '<div class="field" style="margin-top:0">'+lbl('建物地址')+'<input class="txt" value="'+escAttr(A.client.addr)+'" oninput="A.client.addr=this.value;save()"></div>';
  }
  el('body').innerHTML=html;
  refreshProgress();
  window.scrollTo(0,0);
}
function field(k,l){ return '<div class="field">'+lbl(l)+'<input class="txt" value="'+escAttr(A.client[k])+'" oninput="A.client.'+k+'=this.value;save()"></div>'; }
function lbl(l){ return '<label>'+l+'</label>'; }
function esc(s){ return s.replace(/'/g,"\\'"); }
function escAttr(s){ return (s||'').replace(/"/g,'&quot;'); }

/* ============ 互動 ============ */
function pick(id,op,multi){
  if(multi){ const a=A.ans[id]||[]; const i=a.indexOf(op); if(i>=0)a.splice(i,1); else a.push(op); A.ans[id]=a; }
  else A.ans[id]=op;
  save(); render();
}
function pickPrio(i){ const p=A.prio; const k=p.indexOf(i); if(k>=0)p.splice(k,1); else{ if(p.length>=3){el('warn').textContent='最多選 3 個——先取消一個再選。';return;} p.push(i);} el('warn').textContent=''; save(); render(); }
function pickTrade(op){ A.tradeoff=op; save(); render(); }

/* ============ 導覽 + 驗證 ============ */
function requiredMissing(){
  if(cur<9){ const miss=BRIEF[cur].qs.filter(q=>{const v=A.ans[q.id];return !(Array.isArray(v)?v.length:!!v);}); return miss.length?('這一頁還有 '+miss.length+' 題沒作答'):''; }
  if(cur===9) return A.prio.length===3?'':'請依序選出 3 個最重要的重點';
  if(cur===10) return (A.story&&A.story.trim())?'':'請描述你理想中的家（這題必填）';
  return '';
}
function next(){
  const m=requiredMissing(); if(m){ el('warn').textContent=m; return; }
  if(cur===LAST){ buildSummary(); return; }
  cur++; render();
}
function prev(){ if(cur>0){ cur--; render(); } }

/* ============ 需求摘要 ============ */
function buildSummary(){
  save();
  const c=A.client;
  let h='<div class="sumhead"><div class="k">菩語國際設計 · LIVING BRIEF</div><h1>居家深度需求摘要</h1>'+
    '<p>'+(c.name?c.name+'　':'')+(c.proj?'｜'+c.proj:'')+(c.phone?'　·　'+c.phone:'')+'</p></div>';

  // 排序
  h+='<div class="sumsec"><div class="st">最優先的三件事</div><div class="sb"><div class="prio-sum">'+
     A.prio.map((i,k)=>'<div class="p"><em>PRIORITY '+(k+1)+'</em>'+TITLES[i]+'</div>').join('')+'</div></div></div>';

  // 九大面向
  BRIEF.forEach((s,si)=>{
    let rows='';
    s.qs.forEach(q=>{
      const v=A.ans[q.id]; let sa;
      if(Array.isArray(v)&&v.length) sa='<div class="sa">'+v.map(x=>'<span class="chip">'+x+'</span>').join('')+'</div>';
      else if(!Array.isArray(v)&&v) sa='<div class="sa"><span class="chip">'+v+'</span></div>';
      else sa='<div class="sa empty">—（未填）</div>';
      rows+='<div class="sumrow"><div class="sq">'+q.q+'</div>'+sa+'</div>';
    });
    h+='<div class="sumsec"><div class="st"><span class="num">0'+(si+1)+'</span>'+s.title+'</div><div class="sb">'+rows+'</div></div>';
  });

  // 取捨 + 開放
  h+='<div class="sumsec"><div class="st">理想與取捨</div><div class="sb">'+
     '<div class="sumrow"><div class="sq">預算取捨傾向</div><div class="sa">'+(A.tradeoff?'<span class="chip">'+A.tradeoff+'</span>':'<span class="empty">—</span>')+'</div></div>'+
     '<div class="sumrow"><div class="sq">理想的家 / 最不希望再發生的問題</div><div class="sa free">'+(A.story?escHtml(A.story):'<span class="empty">—</span>')+'</div></div>'+
     '</div></div>';

  // 客戶資料
  h+='<div class="sumsec"><div class="st">客戶與案件資料</div><div class="sb">'+
     row2('姓名',c.name)+row2('聯絡電話',c.phone)+row2('Email',c.email)+row2('案名',c.proj)+row2('建物地址',c.addr)+
     '</div></div>';

  h+='<div class="sumactions">'+
     '<button class="pbtn solid" id="sendBtn" onclick="submitToStudio()">送出給菩語</button>'+
     '<button class="pbtn ghost" onclick="window.print()">列印 / 存成 PDF</button>'+
     '<button class="pbtn ghost" onclick="backToEdit()">← 回去修改</button></div>'+
     '<div class="tip" id="sendTip">按「送出給菩語」把需求直接傳給我們；也可以另存 PDF 留底。</div>';

  el('sumBody').innerHTML=h;
  el('s-form').classList.remove('on'); el('s-sum').classList.add('on'); window.scrollTo(0,0);
}
function row2(l,v){ return '<div class="sumrow"><div class="sq">'+l+'</div><div class="sa'+(v?'':' empty')+'">'+(v?escHtml(v):'—')+'</div></div>'; }
function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function backToEdit(){ el('s-sum').classList.remove('on'); el('s-form').classList.add('on'); render(); }

/* ============ 送出給菩語（POST 到 Apps Script） ============ */
function summaryText(){
  const c=A.client; let t='【菩語 · 居家深度需求摘要】\n';
  t+='客戶：'+(c.name||'—')+'　電話：'+(c.phone||'—')+'　Email：'+(c.email||'—')+'\n';
  t+='案名：'+(c.proj||'—')+'　地址：'+(c.addr||'—')+'\n\n';
  t+='◆ 最優先三件事：'+(A.prio.map((i,k)=>(k+1)+'. '+TITLES[i]).join('　')||'—')+'\n\n';
  BRIEF.forEach((s,si)=>{
    t+='【0'+(si+1)+' '+s.title+'】\n';
    s.qs.forEach(q=>{ const v=A.ans[q.id]; const a=Array.isArray(v)?v.join('、'):(v||''); t+='· '+q.q+'\n   → '+(a||'—')+'\n'; });
    t+='\n';
  });
  t+='【理想與取捨】\n· 取捨傾向：'+(A.tradeoff||'—')+'\n· 理想的家 / 最不希望發生：'+(A.story||'—')+'\n';
  return t;
}
function submitToStudio(){
  const btn=el('sendBtn'), tip=el('sendTip');
  if(!CONFIG.SUBMIT_URL){ tip.textContent='（自動寄送尚未設定，請先用「列印 / 存成 PDF」回傳）'; return; }
  btn.disabled=true; btn.textContent='送出中…';
  const body=new URLSearchParams();
  body.set('summary', summaryText());
  body.set('client', JSON.stringify(A.client));
  body.set('data', JSON.stringify({ans:A.ans, prio:A.prio.map(i=>TITLES[i]), tradeoff:A.tradeoff, story:A.story}));
  fetch(CONFIG.SUBMIT_URL, {method:'POST', mode:'no-cors', body})
    .then(()=>{ btn.textContent='✓ 已送出'; tip.textContent='已送給菩語，我們會盡快與你聯繫 — 感謝你這麼用心填寫。你也可以另存 PDF 留底。'; try{localStorage.removeItem(KEY);}catch(e){} })
    .catch(()=>{ btn.disabled=false; btn.textContent='送出給菩語'; tip.textContent='送出失敗，請改用「列印 / 存成 PDF」回傳，或稍後再試。'; });
}

/* ============ 啟動 ============ */
load();
</script>
</body>
</html>
