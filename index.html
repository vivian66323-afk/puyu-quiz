<style>
:root{--ink:#1A1A1A;--cream:#F5F2EC;--gold:#B08D57;--gold-soft:#D9C4A3;--paper:#FBFAF6;--line:#E3DDD1;--muted:#7A756B}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Noto Sans TC",sans-serif;background:var(--cream);color:var(--ink);line-height:1.7;font-weight:300}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
.screen{display:none;padding:0 22px 40px}
.screen.on{display:block;animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* intro */
.intro{min-height:100vh;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:40px 30px}
.frame{width:120px;height:120px;margin:0 auto 28px;border-radius:2px;background:var(--ink);position:relative;overflow:hidden;box-shadow:0 20px 50px rgba(26,26,26,.2)}
.frame::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 35% 32%,var(--gold-soft) 0 10%,transparent 11%),radial-gradient(circle at 68% 64%,var(--gold) 0 8%,transparent 9%),linear-gradient(135deg,#2a2723,#141210)}
.eyebrow{font-size:12px;letter-spacing:.4em;color:var(--gold);font-weight:500;margin-bottom:16px}
.intro h1{font-family:"Noto Serif TC";font-weight:600;font-size:30px;letter-spacing:.03em;line-height:1.4}
.intro p{color:var(--muted);font-size:14.5px;margin:18px auto 0;max-width:340px;line-height:1.9}
.layers{margin:26px 0 34px;font-family:"Noto Serif TC";font-size:15px;letter-spacing:.3em;color:var(--gold)}
.btn{display:inline-block;font-family:inherit;font-size:16px;font-weight:500;cursor:pointer;padding:15px 44px;border-radius:100px;border:1px solid var(--ink);background:var(--ink);color:var(--cream);letter-spacing:.08em;transition:all .2s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink)}
.note{font-size:11.5px;color:var(--muted);margin-top:18px;letter-spacing:.03em}

/* progress */
.topbar{position:sticky;top:0;z-index:10;background:var(--cream);padding:20px 0 14px}
.track{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;background:var(--gold);transition:width .45s ease;width:0}
.qnum{font-size:12px;color:var(--muted);letter-spacing:.1em;margin-top:10px;text-align:center}

/* question */
.qtitle{font-family:"Noto Serif TC";font-size:21px;font-weight:600;text-align:center;margin:8px 0 4px;line-height:1.5}
.qsub{text-align:center;font-size:12.5px;color:var(--gold);letter-spacing:.05em;margin-bottom:20px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper);cursor:pointer;transition:all .15s}
.opt:active{transform:scale(.97)}
.opt img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.opt .lbl{font-size:12.5px;text-align:center;padding:8px 4px;color:var(--muted)}
.opt.sw .sws{display:flex;height:96px}
.opt.sw .sws i{flex:1}

/* result */
.result{padding-top:30px;text-align:center}
.card{background:#fff;border:1px solid var(--gold-soft);border-radius:14px;overflow:hidden;box-shadow:0 20px 50px rgba(26,26,26,.1);margin-bottom:22px}
.card .top{background:var(--ink);color:var(--cream);padding:30px 26px 26px}
.card .top .k{font-size:11px;letter-spacing:.3em;color:var(--gold);margin-bottom:10px}
.card .top h2{font-family:"Noto Serif TC";font-size:32px;font-weight:600;letter-spacing:.04em}
.card .top .en{font-size:11px;letter-spacing:.2em;color:#9a9488;margin-top:4px;text-transform:uppercase}
.card .top .tag{display:inline-block;margin-top:16px;border:1px solid var(--gold);color:var(--gold-soft);border-radius:100px;font-size:12.5px;padding:5px 16px;letter-spacing:.04em}
.card .body{padding:26px 26px 28px}
.card .body .quote{font-family:"Noto Serif TC";font-size:19px;font-weight:500;color:var(--gold);margin-bottom:14px}
.card .body .desc{font-size:14.5px;line-height:1.95;color:#3d3a35;text-align:left}
.card .foot{border-top:1px solid var(--line);padding:14px;font-size:11px;letter-spacing:.14em;color:var(--muted)}
.card .foot .g{color:var(--gold)}
.share{background:var(--gold);color:#fff;border:none;width:100%;font-family:inherit;font-size:16px;font-weight:500;padding:16px;border-radius:100px;cursor:pointer;letter-spacing:.08em;margin-bottom:12px;transition:all .2s}
.share:active{transform:scale(.98)}
.cta{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;margin:18px 0 12px;text-align:center}
.cta p{font-size:14px;margin-bottom:14px}
.cta .lk{display:inline-block;font-size:14px;font-weight:500;color:var(--ink);border-bottom:2px solid var(--gold);padding-bottom:2px;text-decoration:none;cursor:pointer}
.retry{font-family:inherit;font-size:14px;color:var(--muted);background:none;border:none;cursor:pointer;margin-top:10px;text-decoration:underline;letter-spacing:.05em}

.sec{text-align:left;margin-top:20px}
.sec .h{font-size:11px;letter-spacing:.18em;color:var(--gold);font-weight:500;margin-bottom:8px}
.sec ul{list-style:none}
.sec li{font-size:14px;padding:7px 0 7px 20px;position:relative;border-bottom:1px solid var(--line);color:#3d3a35}
.sec li:last-child{border-bottom:none}
.sec li::before{content:"";position:absolute;left:2px;top:15px;width:6px;height:6px;border-radius:50%;background:var(--gold-soft)}
.kwrow{display:flex;flex-wrap:wrap;gap:8px}
.kwrow span{background:var(--paper);border:1px solid var(--gold-soft);color:var(--gold);border-radius:100px;font-size:12.5px;padding:5px 14px;letter-spacing:.04em}
.sec p.t{font-size:14px;line-height:1.9;color:#3d3a35}
.dir{background:linear-gradient(180deg,#1E1B17,#141210);color:var(--cream);border-radius:10px;padding:18px 20px;margin-top:20px;text-align:left}
.dir .h{font-size:11px;letter-spacing:.18em;color:var(--gold-soft);margin-bottom:6px}
.dir p{font-family:"Noto Serif TC";font-size:16px;font-weight:500;line-height:1.6}
.alt{margin-top:18px;text-align:left;background:var(--paper);border-radius:10px;padding:16px 18px}
.alt .h{font-size:11px;letter-spacing:.18em;color:var(--gold);margin-bottom:6px}
.alt b{font-family:"Noto Serif TC";font-size:15px}
.alt span{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:12px 22px;border-radius:100px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
.toast.on{opacity:1}

/* ===== v2 追加：情境 / 狀態 / 燈號 / 行動卡 ===== */
.backrow{height:20px;margin-bottom:8px}
.back{font-size:12.5px;color:var(--muted);background:none;border:none;cursor:pointer;font-family:inherit;padding:0;letter-spacing:.04em}
.back:active{color:var(--gold)}
.ctxwrap{padding-top:34px}
.ctxlist{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.ctxrow{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:16px 18px;cursor:pointer;text-align:left;transition:all .15s}
.ctxrow:active{transform:scale(.98)}
.ctxrow b{font-family:"Noto Serif TC";font-size:16px;font-weight:600;display:block;letter-spacing:.02em}
.ctxrow span{font-size:12.5px;color:var(--muted);display:block;margin-top:3px}
.stq{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 16px 15px;margin-bottom:12px;text-align:left}
.stq .t{font-size:14.5px;line-height:1.7;margin-bottom:13px;color:#3d3a35}
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.sc{border:1px solid var(--line);border-radius:6px;padding:10px 2px;text-align:center;font-size:11.5px;color:var(--muted);background:var(--paper);cursor:pointer;transition:all .15s}
.sc b{display:block;font-family:"Noto Serif TC";font-size:15px;margin-bottom:2px;font-weight:500}
.sc.sel{background:var(--gold);border-color:var(--gold);color:#fff}
.sc.sel b{color:#fff}
.done{width:100%;font-family:inherit;font-size:16px;font-weight:500;padding:16px;border-radius:100px;border:none;background:var(--ink);color:var(--cream);cursor:pointer;letter-spacing:.08em;margin-top:10px}
.done:disabled{background:var(--line);color:#a9a396;cursor:default}
.lamp{width:54px;height:54px;border-radius:50%;margin:0 auto 16px;box-shadow:0 0 0 7px rgba(255,255,255,.07)}
.card .top .band{font-size:12px;letter-spacing:.08em;color:#9a9488;margin-top:14px;line-height:1.6}
.ctxline{background:var(--paper);border:1px solid var(--gold-soft);border-radius:10px;padding:15px 17px;margin-top:18px;font-family:"Noto Serif TC";font-size:14.5px;line-height:1.85;text-align:left;color:#3d3a35}
.state{background:var(--paper);border-left:3px solid var(--gold);border-radius:6px;padding:14px 16px;margin-top:18px;text-align:left}
.state .h{font-size:11px;letter-spacing:.18em;color:var(--gold);margin-bottom:6px;font-weight:500}
.state p{font-size:14px;line-height:1.85;color:#3d3a35}
.act{margin-top:20px;text-align:left;border:1px solid var(--gold-soft);border-radius:10px;overflow:hidden}
.act .hd{background:var(--gold-soft);color:var(--ink);font-family:"Noto Serif TC";font-size:14px;font-weight:600;padding:11px 16px;letter-spacing:.06em}
.act .r{display:flex;gap:12px;padding:13px 16px;border-bottom:1px dashed var(--line);background:#fff}
.act .r:last-child{border-bottom:none}
.act .r b{font-family:"Noto Serif TC";color:var(--gold);min-width:50px;font-size:14.5px;flex-shrink:0}
.act .r span{font-size:13.5px;line-height:1.78;color:#3d3a35}
.cta2{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px 20px;margin:18px 0 12px;text-align:center}
.cta2 h4{font-family:"Noto Serif TC";font-size:16.5px;font-weight:600;margin-bottom:7px}
.cta2 p{font-size:13px;color:var(--muted);margin-bottom:17px;line-height:1.75}
.btn-main{display:block;width:100%;background:var(--ink);color:var(--cream);border:none;font-family:inherit;font-size:15px;font-weight:500;padding:15px;border-radius:100px;cursor:pointer;letter-spacing:.05em;margin-bottom:10px}
.btn-sub{display:block;width:100%;background:none;color:var(--ink);border:1px solid var(--ink);font-family:inherit;font-size:14px;padding:13px;border-radius:100px;cursor:pointer;letter-spacing:.03em}
.btn-main:active,.btn-sub:active{transform:scale(.98)}
</style>
</head>
<body>
<div id="app">
  <section class="screen on" id="s-intro">
    <div class="intro">
      <div class="frame"></div>
      <div class="eyebrow">PURELY · LIFESTYLE DNA</div>
      <h1>你的居家<br>生活方式測驗</h1>
      <p>一個情境、八張畫面、四句真心話。<br>你選的每一個畫面，都在說出你沒說的——你理想中的家，到底長什麼樣子。</p>
      <div class="layers">聽 · 譯 · 顯 · 留 · 陪</div>
      <div><button class="btn" onclick="start()">開始測驗</button></div>

  <section class="screen" id="s-quiz">

  <section class="screen" id="s-state">

  <section class="screen" id="s-result">

      <div id="ctaBox"></div>
      <button class="retry" onclick="reset()">重新測一次</button>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

/* ===================== 流程 ===================== */
let cur=0, scores={}, ctx=null, picks=[], st=[0,0,0,0];
function el(id){return document.getElementById(id)}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));el(id).classList.add('on');window.scrollTo(0,0)}
function start(){cur=0;scores={};picks=[];st=[0,0,0,0];ctx=null;renderCtx();show('s-ctx')}
function reset(){show('s-intro')}

function renderCtx(){
  el('ctxList').innerHTML=CTX.map((c,i)=>
    '<div class="ctxrow" onclick="pickCtx('+i+')"><b>'+c.n+'</b><span>'+c.s+'</span></div>').join('');
}
function pickCtx(i){ctx=CTX[i];cur=0;render();show('s-quiz')}

function render(){
  const q=QUIZ[cur];
  el('bar').style.width=((cur+1)/10*100)+'%';
  el('qnum').textContent=(cur+2)+' / 10';
  let html='<div class="qtitle">'+q.title+'</div><div class="qsub">憑直覺，三秒內選一個</div><div class="opts">';
  q.options.forEach(o=>{
    const arg=JSON.stringify(o.v).replace(/"/g,'&quot;')+','+q.w;
    if(q.type==='swatch'){
      html+='<div class="opt sw" onclick="pick('+arg+')"><div class="sws">'+o.hex.map(h=>'<i style="background:'+h+'"></i>').join('')+'</div><div class="lbl">'+o.label+'</div></div>';
    }else{
      html+='<div class="opt" onclick="pick('+arg+')"><img src="'+o.img+'" loading="lazy"><div class="lbl">'+o.label+'</div></div>';
    }
  });
  el('qbody').innerHTML=html+'</div>';
}
function addScore(v,w,sign){
  scores[v[0]]=(scores[v[0]]||0)+sign*2*w;
  scores[v[1]]=(scores[v[1]]||0)+sign*1*w;
}
function pick(v,w){
  picks[cur]={v:v,w:w}; addScore(v,w,1); cur++;
  if(cur<QUIZ.length){render();window.scrollTo(0,0);}
  else{renderState();show('s-state');}
}
function goBack(){
  if(cur===0){show('s-ctx');return;}
  cur--; const p=picks[cur]; if(p){addScore(p.v,p.w,-1);picks[cur]=null;}
  render();
}
function backToPhotos(){
  cur=QUIZ.length-1; const p=picks[cur]; if(p){addScore(p.v,p.w,-1);picks[cur]=null;}
  render(); show('s-quiz');
}
function renderState(){
  el('bar2').style.width='100%';
  el('stBody').innerHTML=STQ.map((q,i)=>
    '<div class="stq"><div class="t">'+(i+9)+'. '+q+'</div><div class="scale">'+
    SLAB.map((l,j)=>'<div class="sc" data-i="'+i+'" data-v="'+(j+1)+'" onclick="setSt('+i+','+(j+1)+')"><b>'+(j+1)+'</b>'+l+'</div>').join('')+
    '</div></div>').join('');
  el('doneBtn').disabled=true;
}
function setSt(i,v){
  st[i]=v;
  document.querySelectorAll('.sc[data-i="'+i+'"]').forEach(x=>x.classList.remove('sel'));
  document.querySelector('.sc[data-i="'+i+'"][data-v="'+v+'"]').classList.add('sel');
  el('doneBtn').disabled=st.some(x=>x===0);
}

function finish(){
  const sum=st.reduce((a,b)=>a+b,0);
  const band=BANDS.find(b=>sum<=b.max);
  const ranked=ARCH.map(a=>({a,sc:(scores[a.v[0]]||0)*2+(scores[a.v[1]]||0)*1,dom:(scores[a.v[0]]||0)}))
    .sort((x,y)=> y.sc-x.sc || y.dom-x.dom);
  const best=ranked[0].a;
  const alt=ranked.find(r=>r.a.no!==best.no).a;
  const act=ACT[best.no];
  window._result=best; window._band=band; window._ctx=ctx; window._sum=sum; window._alt=alt;

  el('card').innerHTML=
    '<div class="top">'+
      '<div class="lamp" style="background:'+band.color+'"></div>'+
      '<div class="k">你的居家原型</div><h2>'+best.zh+'</h2><div class="en">'+best.en+'</div>'+
      '<div class="tag">'+best.tag+'</div>'+
      '<div class="band">在「'+ctx.n+'」的階段・'+band.name+'（狀態 '+sum+'/16）</div>'+
    '</div>'+
    '<div class="body">'+
      '<div class="quote">「'+best.tag+'」</div>'+
      '<div class="desc">'+best.desc+'</div>'+
      '<div class="ctxline">'+ctx.line+'</div>'+
      '<div class="state"><div class="h">你現在的狀態</div><p>'+band.d+'</p></div>'+
      '<div class="sec"><div class="h">你的三個居家特質</div><ul>'+best.traits.map(t=>'<li>'+t+'</li>').join('')+'</ul></div>'+
      '<div class="sec"><div class="h">你的空間關鍵字</div><div class="kwrow">'+best.kw.map(k=>'<span>'+k+'</span>').join('')+'</div></div>'+
      '<div class="sec"><div class="h">適合你的材質與色調</div><p class="t">'+best.mat+'</p></div>'+
      '<div class="dir"><div class="h">給你的設計方向</div><p>'+best.dir+'</p></div>'+
      '<div class="act"><div class="hd">你的「留 · 捨 · 投資」行動卡</div>'+
        '<div class="r"><b>該留</b><span>'+act.k+'</span></div>'+
        '<div class="r"><b>該捨</b><span>'+act.d+'</span></div>'+
        '<div class="r"><b>該投資</b><span>'+act.i+'</span></div>'+
      '</div>'+
      '<div class="alt"><div class="h">你的另一面</div><b>'+alt.zh+'</b> <span>'+alt.en+'　'+alt.tag+'</span></div>'+
    '</div>'+
    '<div class="foot">菩語國際設計 <span class="g">PURELY</span>　聽 · 譯 · 顯 · 留 · 陪</div>';

  el('ctaBox').innerHTML=
    '<div class="cta2">'+
      '<h4>把「'+best.zh+'」留下來</h4>'+
      '<p>存成一張卡片發限動；或者直接跟菩語聊聊——你的測驗結果會自動帶過去，不用重講一次。</p>'+
      '<button class="btn-main" id="saveBtn" onclick="saveCard()">把這張卡存下來</button>'+
      '<button class="btn-sub" onclick="toLine()">加菩語官方 LINE・聊聊你家的可能 →</button>'+
    '</div>';
  show('s-result');
}

/* ============ 結果卡輸出成圖片（1080×1350） ============ */
const CW=1080, PAD=64, INNER=CW-PAD*2;
function F(weight,size,serif){return weight+' '+size+'px "Noto '+(serif?'Serif':'Sans')+' TC", '+(serif?'serif':'sans-serif');}
const NO_START='。，、；：？！）」』】〉》・…—～%',
      NO_END  ='（「『【〈《';
function wrapCJK(c,text,maxW){
  const out=[]; let line='';
  for(const ch of text){
    if(ch==='\n'){out.push(line);line='';continue;}
    if(line && c.measureText(line+ch).width>maxW){
      // 避頭尾：不讓標點落在行首，也不讓開引號落在行尾
      if(NO_START.indexOf(ch)>=0 && line.length>1){
        out.push(line.slice(0,-1)); line=line.slice(-1)+ch;
      }else if(NO_END.indexOf(line.slice(-1))>=0 && line.length>1){
        out.push(line.slice(0,-1)); line=line.slice(-1)+ch;
      }else{ out.push(line); line=ch; }
    }
    else line+=ch;
  }
  if(line)out.push(line);
  return out;
}
function rr(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y); c.closePath();
}
function secH(c,t,x,y){c.fillStyle='#B08D57';c.font=F(500,21);c.fillText(t.split('').join(' '),x,y);}
async function buildCard(){
  const r=window._result, b=window._band, a=ACT[r.no], cx=window._ctx,
        sum=window._sum, alt=window._alt;
  const cv=document.getElementById('cardCanvas'), c=cv.getContext('2d');
  try{ if(document.fonts&&document.fonts.ready) await document.fonts.ready; }catch(e){}
  const LX=PAD+48, CWD=CW-LX*2, SH=52;

  /* ---------- 第一遍：量 ---------- */
  c.font=F(500,34,true); const Lq=wrapCJK(c,'「'+r.tag+'」',CWD);
  c.font=F(300,30);      const Ld=wrapCJK(c,r.desc,CWD);
  c.font=F(400,28,true); const Lc=wrapCJK(c,cx.line,CWD-56);
  c.font=F(300,28);      const Lb=wrapCJK(c,b.d,CWD-44);
  c.font=F(300,28);      const Lt=r.traits.map(t=>wrapCJK(c,t,CWD-44));
  c.font=F(300,28);      const Lm=wrapCJK(c,r.mat,CWD);
  c.font=F(500,30,true); const Ldir=wrapCJK(c,r.dir,CWD-56);
  c.font=F(300,28);      const La=[a.k,a.d,a.i].map(t=>wrapCJK(c,t,CWD-48-110));
  c.font=F(400,25);
  const pills=r.kw.map(k=>({t:k,w:c.measureText(k).width+46}));
  const kwRows=[]; let row=[], rw=0;
  pills.forEach(p=>{ if(row.length && rw+p.w>CWD){kwRows.push(row);row=[];rw=0;} row.push(p); rw+=p.w+12; });
  if(row.length) kwRows.push(row);

  const GAP=38, HEAD=560, FOOT=214;
  const hQ  = Lq.length*52+12;
  const hD  = Ld.length*48+GAP;
  const hC  = Lc.length*46+44+GAP;
  const hB  = SH+Lb.length*44+GAP;
  const hT  = SH+Lt.reduce((n,x)=>n+Math.max(60,x.length*44+20),0)+GAP;
  const hK  = SH+kwRows.length*64+GAP;
  const hM  = SH+Lm.length*46+GAP;
  const hDir= SH+Ldir.length*48+46+GAP;
  const hA  = 66+La.reduce((n,x)=>n+Math.max(68,x.length*42+30),0)+GAP;
  const hAl = SH+92+GAP;
  const H = HEAD+44+hQ+hD+hC+hB+hT+hK+hM+hDir+hA+hAl+FOOT;
  cv.width=CW; cv.height=H;

  /* ---------- 第二遍：畫 ---------- */
  c.fillStyle='#F5F2EC'; c.fillRect(0,0,CW,H);
  c.fillStyle='#fff'; rr(c,PAD,PAD,CW-PAD*2,H-PAD*2,28); c.fill();
  c.save(); rr(c,PAD,PAD,CW-PAD*2,H-PAD*2,28); c.clip();
  c.fillStyle='#1A1A1A'; c.fillRect(PAD,PAD,CW-PAD*2,HEAD-PAD); c.restore();

  /* 頭 */
  let y=PAD+92; c.textAlign='center';
  c.fillStyle=b.color; c.beginPath(); c.arc(CW/2,y,38,0,Math.PI*2); c.fill();
  y+=96; c.fillStyle='#B08D57'; c.font=F(500,22); c.fillText('你 的 居 家 原 型',CW/2,y);
  y+=76; c.fillStyle='#F5F2EC'; c.font=F(600,68,true); c.fillText(r.zh,CW/2,y);
  y+=40; c.fillStyle='#9a9488'; c.font=F(400,22); c.fillText(r.en.toUpperCase(),CW/2,y);
  y+=58; c.font=F(400,26); const tw=c.measureText(r.tag).width;
  c.strokeStyle='#B08D57'; c.lineWidth=1.5; rr(c,CW/2-tw/2-26,y-30,tw+52,46,23); c.stroke();
  c.fillStyle='#D9C4A3'; c.fillText(r.tag,CW/2,y);
  y+=54; c.fillStyle='#9a9488'; c.font=F(300,23);
  c.fillText('在「'+cx.n+'」的階段 · '+b.name+'（狀態 '+sum+'/16）',CW/2,y);

  /* 內文 */
  c.textAlign='left'; y=HEAD+44; let y0;

  y0=y; c.fillStyle='#B08D57'; c.font=F(500,34,true);
  Lq.forEach((l,i)=>c.fillText(l,LX,y0+i*52)); y+=hQ;

  y0=y; c.fillStyle='#3d3a35'; c.font=F(300,30);
  Ld.forEach((l,i)=>c.fillText(l,LX,y0+i*48)); y+=hD;

  y0=y;                                             /* 情境 */
  c.fillStyle='#FBFAF6'; c.strokeStyle='#D9C4A3'; c.lineWidth=1.5;
  rr(c,LX,y0-34,CWD,Lc.length*46+44,10); c.fill(); c.stroke();
  c.fillStyle='#3d3a35'; c.font=F(400,28,true);
  Lc.forEach((l,i)=>c.fillText(l,LX+28,y0+i*46)); y+=hC;

  y0=y; secH(c,'你現在的狀態',LX,y0);                 /* 狀態 */
  c.fillStyle='#B08D57'; c.fillRect(LX,y0+22,4,Lb.length*44-8);
  c.fillStyle='#3d3a35'; c.font=F(300,28);
  Lb.forEach((l,i)=>c.fillText(l,LX+24,y0+SH+i*44)); y+=hB;

  y0=y; secH(c,'你的三個居家特質',LX,y0);              /* 特質 */
  let ty=y0+SH;
  Lt.forEach((L,i)=>{
    c.fillStyle='#D9C4A3'; c.beginPath(); c.arc(LX+7,ty-10,7,0,Math.PI*2); c.fill();
    c.fillStyle='#3d3a35'; c.font=F(300,28);
    L.forEach((l,j)=>c.fillText(l,LX+34,ty+j*44));
    ty+=Math.max(60,L.length*44+20);
    if(i<2){c.strokeStyle='#E3DDD1';c.lineWidth=1;c.beginPath();c.moveTo(LX,ty-30);c.lineTo(LX+CWD,ty-30);c.stroke();}
  }); y+=hT;

  y0=y; secH(c,'你的空間關鍵字',LX,y0);                /* 關鍵字 */
  let ky=y0+SH-6;
  kwRows.forEach(rowP=>{
    let kx=LX;
    rowP.forEach(p=>{
      c.fillStyle='#FBFAF6'; c.strokeStyle='#D9C4A3'; c.lineWidth=1.5;
      rr(c,kx,ky-34,p.w,48,24); c.fill(); c.stroke();
      c.fillStyle='#B08D57'; c.font=F(400,25); c.textAlign='center';
      c.fillText(p.t,kx+p.w/2,ky); c.textAlign='left';
      kx+=p.w+12;
    });
    ky+=64;
  }); y+=hK;

  y0=y; secH(c,'適合你的材質與色調',LX,y0);            /* 材質 */
  c.fillStyle='#3d3a35'; c.font=F(300,28);
  Lm.forEach((l,i)=>c.fillText(l,LX,y0+SH+i*46)); y+=hM;

  y0=y;                                             /* 設計方向 */
  c.fillStyle='#1A1A1A'; rr(c,LX,y0-26,CWD,SH+Ldir.length*48+22,12); c.fill();
  c.fillStyle='#D9C4A3'; c.font=F(500,21); c.fillText('給 你 的 設 計 方 向',LX+28,y0+8);
  c.fillStyle='#F5F2EC'; c.font=F(500,30,true);
  Ldir.forEach((l,i)=>c.fillText(l,LX+28,y0+SH+12+i*48)); y+=hDir;

  y0=y;                                             /* 留捨投資 */
  c.fillStyle='#D9C4A3'; rr(c,LX,y0-34,CWD,52,8); c.fill();
  c.fillStyle='#1A1A1A'; c.font=F(600,26,true); c.fillText('  留 · 捨 · 投資',LX+8,y0);
  let ay=y0+66;
  ['該留','該捨','該投資'].forEach((lab,i)=>{
    c.fillStyle='#B08D57'; c.font=F(500,28,true); c.fillText(lab,LX,ay);
    c.fillStyle='#3d3a35'; c.font=F(300,28);
    La[i].forEach((l,j)=>c.fillText(l,LX+110,ay+j*42));
    ay+=Math.max(68,La[i].length*42+30);
    if(i<2){c.strokeStyle='#E3DDD1';c.lineWidth=1;c.beginPath();c.moveTo(LX,ay-32);c.lineTo(LX+CWD,ay-32);c.stroke();}
  }); y+=hA;

  y0=y;                                             /* 另一面 */
  c.fillStyle='#FBFAF6'; rr(c,LX,y0-32,CWD,SH+70,10); c.fill();
  secH(c,'你的另一面',LX+28,y0);
  c.fillStyle='#1A1A1A'; c.font=F(600,28,true); c.fillText(alt.zh,LX+28,y0+48);
  const aw=c.measureText(alt.zh).width;
  c.fillStyle='#7A756B'; c.font=F(300,24); c.fillText(alt.tag,LX+28+aw+20,y0+48);

  /* 頁尾：品牌 + 聯繫方式 */
  c.textAlign='center';
  const FY=H-PAD-166;
  c.strokeStyle='#E3DDD1'; c.lineWidth=1;
  c.beginPath(); c.moveTo(LX,FY); c.lineTo(LX+CWD,FY); c.stroke();
  c.fillStyle='#1A1A1A'; c.font=F(600,34,true);
  c.fillText('菩語國際設計',CW/2,FY+58);
  c.fillStyle='#B08D57'; c.font=F(500,20);
  c.fillText('P U R E L Y   I N T E R I O R   D E S I G N',CW/2,FY+92);
  c.fillStyle='#7A756B'; c.font=F(300,23);
  c.fillText('聽 · 譯 · 顯 · 留 · 陪',CW/2,FY+130);
  c.fillStyle='#3d3a35'; c.font=F(400,24);
  c.fillText('LINE @mtz3778c　│　0960-558-533　│　purely2006.com',CW/2,FY+172);
  return cv;
}
/* ---- 加 LINE，把測驗結果當開場白帶過去 ---- */
const LINE_ID='@mtz3778c';
function lineMsg(){
  const r=window._result, c=window._ctx, b=window._band;
  return '我剛測完菩語生活測驗，結果是「'+r.zh+'」，目前在'+c.n+'（'+b.name+'）。想聊聊我家的可能。';
}
/* ---- iframe 安全跳轉：Wix 等嵌入環境會擋掉 iframe 內的 top-level 導頁 ---- */
const INFRAME = (function(){ try{ return window.self!==window.top; }catch(e){ return true; } })();
function goOut(url){
  const w=window.open(url,'_blank','noopener');
  if(w) return true;
  try{ window.top.location.href=url; return true; }catch(e){}
  try{ location.href=url; return true; }catch(e){}
  return false;
}
function toLine(){
  const msg=lineMsg();
  try{ if(navigator.clipboard) navigator.clipboard.writeText(msg); }catch(e){}
  toast('結果已複製，貼上就能傳給菩語');
  const url='https://line.me/R/oaMessage/'+encodeURIComponent(LINE_ID)+'/?'+encodeURIComponent(msg);
  setTimeout(()=>{ if(!goOut(url)) toast('請開啟 LINE 搜尋 '+LINE_ID+'，結果已複製'); }, 700);
}
function shareText(){
  const r=window._result,b=window._band;
  return '我的居家原型是【'+r.zh+'・'+r.en+'】——'+r.tag+'。\n目前狀態：'+b.name+'。\n你呢？來測你的居家 Lifestyle DNA！\n#菩語生活測驗 #PURELY';
}
function canvasBlob(cv){return new Promise(res=>cv.toBlob(res,'image/png'));}
async function saveCard(){
  const btn=document.getElementById('saveBtn'); const old=btn.textContent;
  btn.textContent='產生中…'; btn.disabled=true;
  try{
    const cv=await buildCard();
    const blob=await canvasBlob(cv);
    const name='菩語居家原型_'+window._result.zh+'.png';
    const file=new File([blob],name,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],text:shareText()});
      toast('已送出，貼到限動吧！');
    }else{
      const href=URL.createObjectURL(blob);
      if(INFRAME){
        /* 嵌入環境多半擋 download，改開新分頁讓使用者自己長按／右鍵存 */
        const w=window.open(href,'_blank');
        toast(w ? '卡片已開新分頁，長按或右鍵存下來' : '請允許彈出視窗，才能存下卡片');
      }else{
        const a=document.createElement('a');
        a.href=href; a.download=name;
        document.body.appendChild(a); a.click(); a.remove();
        toast('卡片已存到你的下載資料夾');
      }
      setTimeout(()=>URL.revokeObjectURL(href),20000);
    }
  }catch(e){ console.error(e); toast('存檔失敗，先截圖也可以'); }
  btn.textContent=old; btn.disabled=false;
}
async function doShare(){
  const txt=shareText();
  try{
    const cv=await buildCard();
    const blob=await canvasBlob(cv);
    const file=new File([blob],'菩語居家原型.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],text:txt}); return;
    }
  }catch(e){}
  if(navigator.share){ try{ await navigator.share({title:'菩語生活測驗',text:txt}); return; }catch(e){} }
  if(navigator.clipboard) navigator.clipboard.writeText(txt);
  toast('文字已複製，也可以按「把這張卡存下來」');
}
let tt;
function toast(m){const t=el('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600);}
